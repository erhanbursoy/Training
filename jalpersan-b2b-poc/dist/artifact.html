              h('td.num.mono', { text: JP.fmt.miktar(k.rezerv) }),
              h('td.num.mono', { text: JP.fmt.miktar(k.fatura) }),
              h('td.num.mono', { text: JP.fmt.miktar(k.donusturulebilir), style: { color: k.donusturulebilir > 0 ? 'var(--warn)' : 'var(--text-3)' } }),
              h('td', { style: { width: '140px' } }, UI.bant(k))
            ]);
          }))
      ]));
    }));
  }

  function donusumKip(t) {
    var kalemler = JP.talepKalemDurum(t).filter(function (k) { return k.donusturulebilir > 0.001; });
    var secim = {};
    kalemler.forEach(function (k) { secim[k.kalem.id] = { dahil: true, miktar: k.donusturulebilir }; });
    var ozet = h('div.small.muted');

    function ozetGuncelle() {
      var n = 0, m = 0;
      kalemler.forEach(function (k) { var s = secim[k.kalem.id]; if (s.dahil && s.miktar > 0) { n++; m += s.miktar; } });
      ozet.textContent = n + ' kalem · ' + JP.fmt.miktar(m) + ' birim siparişe dönecek. Kalan miktar havuzda açık kalır.';
    }

    var satirlar = kalemler.map(function (k) {
      var mik = h('input.qty', {
        type: 'number', min: '0', max: String(k.donusturulebilir), step: '10', value: String(k.donusturulebilir),
        oninput: function (e) { secim[k.kalem.id].miktar = parseFloat(e.target.value) || 0; ozetGuncelle(); }
      });
      var kutu = h('input', {
        type: 'checkbox', checked: true,
        onchange: function (e) { secim[k.kalem.id].dahil = e.target.checked; mik.disabled = !e.target.checked; ozetGuncelle(); }
      });
      return h('tr', {}, [
        h('td', {}, h('label.chk', {}, [kutu, h('span', { text: k.urun.ad })])),
        h('td.mono.small', { text: k.kalem.urunKod }),
        h('td.num.mono', { text: JP.fmt.miktar(k.talep) }),
        h('td.num.mono', { text: JP.fmt.miktar(k.donusturulebilir) }),
        h('td', {}, h('div.row.tight', {}, [mik, h('span.small.muted', { text: k.urun.birim })]))
      ]);
    });
    ozetGuncelle();

    UI.modal({
      baslik: 'Satın alma talebini siparişe dönüştür', etiket: t.no + ' · ' + bayiAd(t.bayiKod), genis: true,
      icerik: h('div.stack', {}, [
        UI.tablo(['Kalem', 'Kod', { t: 'Talep', num: true }, { t: 'Açık', num: true }, 'Sipariş miktarı'], satirlar),
        ozet,
        h('div.note', { text: 'Sipariş portalda “Taslak” olarak oluşur ve havuzda rezerv hareketi yazılır. Logo’ya gönderim ayrı bir adımdır.' })
      ]),
      aksiyonlar: function (kapat) {
        return [
          h('button.btn', { text: 'Vazgeç', onclick: kapat }),
          h('button.btn.primary', {
            text: 'Sipariş oluştur',
            onclick: function () {
              UI.dene(function () {
                var s = JP.siparisOlustur(t.bayiKod, kalemler.filter(function (k) { return secim[k.kalem.id].dahil; })
                  .map(function (k) { return { talepNo: t.no, kalemId: k.kalem.id, miktar: secim[k.kalem.id].miktar }; }), 'muhasebe');
                kapat();
                UI.toast('Sipariş oluşturuldu', s.no + ' · Siparişler ekranından Logo’ya gönderin.', 'ok');
              });
            }
          })
        ];
      }
    });
  }

  /* ------------------------------------------------------------- siparişler */
  function siparisler() {
    var db = JP.db;
    if (!db.siparisler.length) return h('div.empty', { text: 'Henüz sipariş yok. Gelen talepler ekranından oluşturun.' });

    return h('div.stack', {}, [
      h('div.row', {}, [
        h('button.btn.primary', {
          text: 'Sipariş ve fatura durumunu sorgula',
          onclick: function () {
            UI.dene(function () {
              var r = JP.durumSorgula();
              UI.toast('Sorgu tamamlandı',
                r.okunanFis + ' fiş · ' + r.miktarDegisimi + ' miktar değişimi · ' + (r.faturaHareketi + r.fifo) + ' fatura hareketi · ' +
                r.eslesmeyen + ' eşleşmeyen · ' + r.atlanan + ' mükerrer atlandı', 'ok');
            });
          }
        }),
        UI.senkronBilgi(db.senkron.siparis)
      ]),
      h('div.stack', {}, db.siparisler.map(siparisKarti))
    ]);
  }

  function siparisKarti(s) {
    var db = JP.db;
    var fis = db.logo.fisler.find(function (f) { return f.portalRef === s.logoRef; });
    var faturalar = fis ? db.logo.faturalar.filter(function (f) { return f.fisNo === fis.fisNo; }) : [];
    var toplam = s.kalemler.reduce(function (t, k) { return t + k.logoMiktar; }, 0);
    var fat = s.kalemler.reduce(function (t, k) { return t + k.faturalanan; }, 0);

    return UI.panel(null, null, h('div.stack', {}, [
      h('div.row', {}, [
        h('span.mono', { text: s.no, style: { fontWeight: '600' } }),
        UI.rozet(s.durum),
        h('span', { text: bayiAd(s.bayiKod) }),
        s.logoFisNo ? h('span.tag', { text: 'Logo fiş ' + s.logoFisNo }) : null,
        h('span.tag', { text: 'ref ' + s.logoRef }),
        h('div.spacer'),
        (s.durum === 'Taslak' || s.durum === 'Gönderim Hatası') ? h('button.btn.primary.sm', {
          text: s.durum === 'Gönderim Hatası' ? 'Yeniden gönder' : "Logo'ya gönder",
          onclick: function () { UI.dene(function () { JP.siparisLogoyaGonder(s.no); UI.toast('Logo’ya iletildi', 'Fiş numarası siparişe yazıldı.', 'ok'); }); }
        }) : null,
        s.durum === 'Taslak' ? h('button.btn.ghost.sm', {
          text: 'Gönderim hatası simüle et',
          onclick: function () { UI.dene(function () { JP.siparisLogoyaGonder(s.no, true); UI.toast('Gönderim başarısız', 'Sipariş portalda korunuyor, yeniden denenebilir.', 'bad'); }); }
        }) : null,
        (s.durum !== 'Tamamlandı' && s.durum !== 'İptal') ? h('button.btn.ghost.sm', {
          text: 'Durum sorgula', onclick: function () { UI.dene(function () { JP.durumSorgula(s.no); UI.toast('Sorgulandı', s.no, 'ok'); }); }
        }) : null,
        (s.durum !== 'Tamamlandı' && s.durum !== 'İptal') ? h('button.btn.ghost.sm', {
          text: 'İptal', onclick: function () { UI.onay('Siparişi iptal et', s.no + ' iptal edilecek ve rezerv havuzda çözülecek. Logo fişi elle iptal edilmelidir.', function () { JP.siparisIptal(s.no); UI.toast('Sipariş iptal edildi', null, 'ok'); }, true); }
        }) : null
      ]),
      s.hataMetni ? h('div.note.bad', { text: s.hataMetni }) : null,
      UI.tablo(['Ürün', 'Talep', { t: 'Sipariş', num: true }, { t: "Logo'daki miktar", num: true }, { t: 'Faturalanan', num: true }, { t: 'Kalan', num: true }],
        s.kalemler.map(function (k) {
          var degisti = Math.abs(k.logoMiktar - k.miktar) > 0.001;
          return h('tr', {}, [
            h('td', {}, [h('div', { text: urunAd(k.urunKod) }), h('div.pc.mono', { text: k.urunKod })]),
            h('td.mono.small', { text: k.talepNo }),
            h('td.num.mono', { text: JP.fmt.miktar(k.miktar) }),
            h('td.num.mono', { text: JP.fmt.miktar(k.logoMiktar), style: degisti ? { color: 'var(--warn)', fontWeight: '600' } : null,
              title: degisti ? 'Logo’da değiştirildi; rezerv havuzda düzeltildi.' : '' }),
            h('td.num.mono', { text: JP.fmt.miktar(k.faturalanan) }),
            h('td.num.mono', { text: JP.fmt.miktar(Math.max(0, k.logoMiktar - k.faturalanan)) })
          ]);
        })),
      h('div.row.small.muted', {}, [
        h('span', { text: 'Faturalanan ' + JP.fmt.miktar(fat) + ' / ' + JP.fmt.miktar(toplam) + ' birim' }),
        faturalar.length ? h('span', { text: '·' }) : null,
        faturalar.length ? h('div.row.tight', {}, faturalar.map(function (f) {
          return h('span.tag', { title: 'GİB: ' + f.gib, text: f.no + ' · ' + f.gib });
        })) : null
      ])
    ]));
  }

  /* ------------------------------------------------------ 3.6 talep havuzu */
  var havuzFiltre = { bayiKod: '', sadeceAcik: false };

  function havuz() {
    var db = JP.db;
    var satirlar = JP.havuzOzet(havuzFiltre);
    var eslesmeyen = db.talepDisi.filter(function (t) { return !t.cozuldu; });
    var hs = db.havuz.filter(function (x) { return !havuzFiltre.bayiKod || x.bayiKod === havuzFiltre.bayiKod; })
      .sort(function (a, b) { return b.ts.localeCompare(a.ts); }).slice(0, 250);
    var top = satirlar.reduce(function (t, r) { t.talep += r.talep; t.rezerv += r.rezerv; t.fatura += r.fatura; t.acik += r.acik; return t; },
      { talep: 0, rezerv: 0, fatura: 0, acik: 0 });

    return h('div.stack', {}, [
      h('div.row', {}, [
        h('select', { style: { width: 'auto' }, onchange: function (e) { havuzFiltre.bayiKod = e.target.value; JP.tx(function () {}); } },
          [h('option', { value: '', text: 'Tüm bayiler', selected: !havuzFiltre.bayiKod })].concat(
            db.bayiler.map(function (b) { return h('option', { value: b.kod, selected: havuzFiltre.bayiKod === b.kod, text: b.unvan }); }))),
        h('label.chk', {}, [h('input', { type: 'checkbox', checked: havuzFiltre.sadeceAcik, onchange: function (e) { havuzFiltre.sadeceAcik = e.target.checked; JP.tx(function () {}); } }), 'Yalnızca açığı olanlar']),
        h('div.spacer'),
        h('button.btn.sm', { text: 'Elle hareket ekle', onclick: elleHareketKip }),
        h('button.btn.ghost.sm', { text: "Excel'e kopyala", onclick: function () { havuzKopyala(satirlar); } })
      ]),
      h('div.grid.k4', {}, [
        UI.kpi('Talep', JP.fmt.miktar(top.talep), 'birim'),
        UI.kpi('Siparişte', JP.fmt.miktar(top.rezerv), 'birim', 'Rezerve'),
        UI.kpi('Faturalanan', JP.fmt.miktar(top.fatura), 'birim'),
        UI.kpi('Açık', JP.fmt.miktar(top.acik), 'birim', 'Siparişe dönüştürülebilir', true)
      ]),
      eslesmeyen.length ? UI.panel('Talep dışı fatura (' + eslesmeyen.length + ')', h('span.small.muted', { text: 'Kademe 3 — talep bulunamadı veya talebi aşıyor' }),
        UI.tablo(['Tarih', 'Fatura', 'Bayi', 'Ürün', { t: 'Miktar', num: true }, ''], eslesmeyen.map(function (td) {
          return h('tr', {}, [
            h('td.small', { text: JP.fmt.tarih(td.ts) }),
            h('td.mono.small', { text: td.faturaNo }),
            h('td', { text: bayiAd(td.bayiKod) }),
            h('td.mono.small', { text: td.urunKod }),
            h('td.num.mono', { text: JP.fmt.miktar(td.miktar) }),
            h('td.right', {}, h('button.btn.sm', { text: 'Talebe bağla', onclick: function () { bagliKip(td); } }))
          ]);
        })), true) : null,
      UI.panel('Bayi × ürün bakiyesi', UI.bantAciklama(),
        UI.tablo(['Bayi', 'Ürün', { t: 'Talep', num: true }, { t: 'Siparişte', num: true }, { t: 'Faturalanan', num: true }, { t: 'Açık', num: true }, 'Dağılım', { t: 'Yaş', num: true }],
          satirlar.map(function (r) {
            return h('tr', {}, [
              h('td.small', { text: bayiAd(r.bayiKod) }),
              h('td', {}, [h('div.small', { text: urunAd(r.urunKod) }), h('div.pc.mono', { text: r.urunKod })]),
              h('td.num.mono', { text: JP.fmt.miktar(r.talep) }),
              h('td.num.mono', { text: JP.fmt.miktar(r.rezerv) }),
              h('td.num.mono', { text: JP.fmt.miktar(r.fatura) }),
              h('td.num.mono', { text: JP.fmt.miktar(r.acik) }),
              h('td', { style: { width: '150px' } }, UI.bant(r)),
              h('td.num.small.muted', { text: r.yas + ' g' })
            ]);
          }), 'Havuzda hareket yok.'), true),
      UI.panel('Hareket defteri', h('span.small.muted', { text: db.havuz.length + ' hareket · en yeni 250 kayıt' }), hareketDefteri(hs), true)
    ]);
  }

  function hareketDefteri(hs) {
    return UI.tablo(['Tarih', 'Bayi', 'Ürün', 'Tip', { t: 'Miktar', num: true }, 'Kaynak', 'Eşleşme', 'Belge', 'Kullanıcı', 'Açıklama'],
      hs.map(function (x) {
        return h('tr.ledger', {}, [
          h('td.small.nowrap', { text: JP.fmt.saat(x.ts) }),
          h('td.small', { text: x.bayiKod }),
          h('td.mono.small', { text: x.urunKod }),
          h('td', {}, h('span.tag', { text: x.tip })),
          h('td.num.mono' + (x.miktar < 0 ? '.sgn-neg' : '.sgn-pos'), { text: (x.miktar > 0 ? '+' : '') + JP.fmt.miktar(x.miktar) }),
          h('td', {}, h('span.src.' + x.kaynak, { text: x.kaynak })),
          h('td.small', { text: x.eslesme || '—' }),
          h('td.mono.small', { text: x.belge || '—' }),
          h('td.small.muted', { text: x.kullanici + (x.sebep ? ' · ' + x.sebep : '') }),
          h('td.small.muted', { text: x.aciklama })
        ]);
      }), 'Hareket yok.');
  }

  function havuzKopyala(satirlar) {
    UI.tabloKopyala('Talep havuzu', [['Bayi kodu', 'Bayi', 'Ürün kodu', 'Ürün', 'Talep', 'Siparişte', 'Faturalanan', 'Açık', 'Yaş (gün)']].concat(
      satirlar.map(function (r) { return [r.bayiKod, bayiAd(r.bayiKod), r.urunKod, urunAd(r.urunKod), r.talep, r.rezerv, r.fatura, r.acik, r.yas]; })));
  }

  function elleHareketKip() {
    var db = JP.db;
    var bayiSec = h('select', {}, db.bayiler.map(function (b) { return h('option', { value: b.kod, text: b.unvan }); }));
    var urunSec = h('select', {}, db.urunler.map(function (u) { return h('option', { value: u.kod, text: u.kod + ' — ' + u.ad }); }));
    var tipSec = h('select', {}, [
      h('option', { value: 'dFatura', text: 'dFatura — elle tahsis (talebi kapatır)' }),
      h('option', { value: 'dTalep', text: 'dTalep — talep düzeltmesi' }),
      h('option', { value: 'dRezerv', text: 'dRezerv — rezerv düzeltmesi' })
    ]);
    var sebepSec = h('select', {}, JP.SEBEPLER.map(function (s) { return h('option', { value: s.kod, text: s.kod + ' — ' + s.ad }); }));
    var mik = h('input', { type: 'number', step: '10', value: '0' });
    var acik = h('input', { type: 'text', placeholder: 'Örn. kartela gönderimi, fatura kesilmedi' });

    UI.modal({
      baslik: 'Elle havuz hareketi', etiket: 'Sebep kodu zorunlu',
      icerik: h('div.stack', {}, [
        h('div.note', { text: 'Logo’da faturası bulunmayan istisnalar (numune, konsinye, geçmiş dönem) için kullanılır. Raporlarda ayrı gösterilir.' }),
        h('div.grid.k2', {}, [
          h('label.f', {}, ['Bayi', bayiSec]),
          h('label.f', {}, ['Ürün', urunSec]),
          h('label.f', {}, ['Hareket tipi', tipSec]),
          h('label.f', {}, ['Sebep kodu', sebepSec]),
          h('label.f', {}, ['Miktar (− için eksi girin)', mik]),
          h('label.f', {}, ['Açıklama', acik])
        ])
      ]),
      aksiyonlar: function (kapat) {
        return [
          h('button.btn', { text: 'Vazgeç', onclick: kapat }),
          h('button.btn.primary', {
            text: 'Hareketi yaz',
            onclick: function () {
              UI.dene(function () {
                JP.elleHareket({
                  bayiKod: bayiSec.value, urunKod: urunSec.value, tip: tipSec.value,
                  miktar: parseFloat(mik.value) || 0, sebep: sebepSec.value, aciklama: acik.value || 'Elle hareket'
                });
                kapat(); UI.toast('Hareket yazıldı', 'Bakiye hareketlerden yeniden hesaplandı.', 'ok');
              });
            }
          })
        ];
      }
    });
  }

  function bagliKip(td) {
    var adaylar = [];
    JP.db.talepler.forEach(function (t) {
      if (t.bayiKod !== td.bayiKod || t.iptal) return;
      t.kalemler.forEach(function (k) {
        if (k.urunKod !== td.urunKod) return;
        var b = JP.kalemBakiye(k.id);
        adaylar.push({ talep: t, kalem: k, acik: b.acik });
      });
    });
    var sec = h('select', {}, adaylar.length
      ? adaylar.map(function (a) { return h('option', { value: a.kalem.id, text: a.talep.no + ' · ' + JP.fmt.tarih(a.talep.tarih) + ' · açık ' + JP.fmt.miktar(a.acik) }); })
      : [h('option', { value: '', text: 'Uygun talep kalemi yok' })]);

    UI.modal({
      baslik: 'Talep dışı faturayı bağla', etiket: td.faturaNo,
      icerik: h('div.stack', {}, [
        h('dl.kv', {}, [
          h('dt', { text: 'Bayi' }), h('dd', { text: bayiAd(td.bayiKod) }),
          h('dt', { text: 'Ürün' }), h('dd', { text: urunAd(td.urunKod) + ' (' + td.urunKod + ')' }),
          h('dt', { text: 'Miktar' }), h('dd.mono', { text: JP.fmt.miktar(td.miktar) })
        ]),
        h('label.f', {}, ['Bağlanacak talep kalemi', sec]),
        h('div.small.muted', { text: 'Hareket “elle” eşleşme kademesiyle yazılır ve eşleşme kalitesi raporunda ayrı sayılır.' })
      ]),
      aksiyonlar: function (kapat) {
        return [
          h('button.btn', { text: 'Vazgeç', onclick: kapat }),
          h('button.btn.primary', {
            text: 'Bağla', disabled: !adaylar.length,
            onclick: function () { UI.dene(function () { JP.talepDisiBagla(td.id, sec.value); kapat(); UI.toast('Bağlandı', null, 'ok'); }); }
          })
        ];
      }
    });
  }

  /* ---------------------------------------------------------------- ürünler */
  function urunler() {
    var db = JP.db;
    if (!db.urunler.length) return h('div.note.warn', { html: '<b>Ürün yok.</b> Panel ekranından “Ürünleri Logo’dan al” işlemini çalıştırın.' });
    return UI.panel('Stok kartları', h('span.small.muted', { text: 'Kod, ad, birim ve grup Logo’dan gelir — salt okunur' }),
      UI.tablo(['', 'Ürün', 'Grup', 'Birim', 'Logo', 'Siparişe', 'Açıklama (portal)'],
        db.urunler.slice().sort(function (a, b) { return a.grup.localeCompare(b.grup) || a.sira - b.sira; }).map(function (u) {
          return h('tr', {}, [
            h('td', { style: { width: '54px' } }, UI.kartela(u, '34px')),
            h('td', {}, [h('div', { text: u.ad }), h('div.pc.mono', { text: u.kod })]),
            h('td.small', { text: u.grup }),
            h('td.small.mono', { text: u.birim }),
            h('td', {}, u.logodaYok ? UI.rozet("Logo'da yok", 'bad') : (u.logoAktif ? UI.rozet('Aktif', 'ok') : UI.rozet('Pasif', 'warn'))),
            h('td', {}, h('label.chk', {}, [h('input', {
              type: 'checkbox', checked: u.siparieAcik, disabled: !u.logoAktif,
              onchange: function (e) { var v = e.target.checked; JP.tx(function (d) { d.urunler.find(function (x) { return x.kod === u.kod; }).siparieAcik = v; }); }
            }), h('span.small', { text: u.siparieAcik ? 'Açık' : 'Kapalı' })])),
            h('td', { style: { minWidth: '260px' } }, h('input', {
              type: 'text', value: u.aciklama || '', placeholder: JP.aciklamaOf(u.grup),
              onchange: function (e) { var v = e.target.value; JP.tx(function (d) { d.urunler.find(function (x) { return x.kod === u.kod; }).aciklama = v; }); }
            }))
          ]);
        })), true);
  }

  /* ---------------------------------------------------------------- bayiler */
  function bayiler() {
    var db = JP.db;
    if (!db.bayiler.length) return h('div.note.warn', { html: '<b>Bayi yok.</b> Panel ekranından “Bayileri Logo’dan al” işlemini çalıştırın.' });
    return UI.panel('Cari kartlar', h('span.small.muted', { text: 'Unvan ve ülke Logo’dan gelir — salt okunur' }),
      UI.tablo(['Bayi', 'Şehir / Ülke', 'Logo', 'Siparişe', 'Ürün kısıtı', ''],
        db.bayiler.map(function (b) {
          return h('tr', {}, [
            h('td', {}, [h('div', { text: b.unvan }), h('div.pc.mono', { text: b.kod + ' · ' + b.eposta })]),
            h('td.small', { text: b.sehir + ' / ' + b.ulke }),
            h('td', {}, b.logodaYok ? UI.rozet("Logo'da yok", 'bad') : (b.logoAktif ? UI.rozet('Aktif', 'ok') : UI.rozet('Pasif', 'warn'))),
            h('td', {}, h('label.chk', {}, [h('input', {
              type: 'checkbox', checked: b.siparisAcik, disabled: !b.logoAktif,
              onchange: function (e) { var v = e.target.checked; JP.tx(function (d) { d.bayiler.find(function (x) { return x.kod === b.kod; }).siparisAcik = v; }); }
            }), h('span.small', { text: b.siparisAcik ? 'Açık' : 'Kapalı' })])),

/* Logo ERP simülatörü — ana veri (stok/cari), portaldan düşen sipariş fişleri,
   miktar değişimi, kısmi ve çoklu fatura, GİB gönderimi.

(function () {
  'use strict';
  var JP = window.JP, UI = JP.UI, h = UI.h;

  JP.logoEkran = function () {
    UI.kabuk({
      rol: 'logo', rolAdi: 'Logo simülatörü', baslik: 'Logo ERP simülatörü', altBaslik: 'Tiger 3 · simülasyon',

      ustSag: function () { return h('span.small.muted', { text: 'LG_025_* tabloları · REST servisi' }); },
      bolumler: [
        { id: 'fisler', ad: 'Sipariş fişleri', baslik: 'Sipariş fişleri (ORFICHE)',
          aciklama: 'Portalın gönderdiği siparişler buraya düşer. Miktarı değiştirin, kısmi veya çoklu fatura kesin.',
          ciz: fisler, sayi: function () { return JP.db.logo.fisler.length; },
          sicak: function () { return JP.db.logo.fisler.some(function (f) { return !f.iptal && kalanFis(f) > 0.001; }); } },
        { id: 'faturalar', ad: 'Faturalar', baslik: 'Faturalar (INVOICE + e-Fatura)',
          aciklama: 'Kesilen faturalar ve GİB gönderim durumu. Sipariş bağlantısı olmayan serbest fatura da kesilebilir.',
          ciz: faturalar, sayi: function () { return JP.db.logo.faturalar.length; },
          sicak: function () { return JP.db.logo.faturalar.some(function (f) { return f.gib === 'Kesilmedi'; }); } },
        { id: 'stok', ad: 'Stok kartları', baslik: 'Stok kartları (LG_025_ITEMS)',
          aciklama: 'Ana veri burada durur. Portal bu kartları yalnızca okur; kart oluşturmaz.', ciz: stok,
          sayi: function () { return JP.db.logo.stok.length; } },
        { id: 'cari', ad: 'Cari kartlar', baslik: 'Cari kartlar (LG_025_CLCARD)',

          sayi: function () { return JP.db.logo.cari.length; } }

  };

  function kalanFis(f) {

  }
  function cariAd(kod) { var c = JP.db.logo.cari.find(function (x) { return x.kod === kod; }); return c ? c.unvan : kod; }
  function stokAd(kod) { var s = JP.db.logo.stok.find(function (x) { return x.kod === kod; }); return s ? s.ad : kod; }

  /* ---------------------------------------------------------- sipariş fişleri */
  function fisler() {

  }

  function fisKarti(f) {
    var db = JP.db;
    var faturalar = db.logo.faturalar.filter(function (x) { return x.fisNo === f.fisNo; });
    var kalan = kalanFis(f);
    var durum = f.iptal ? 'İptal' : (kalan <= 0.001 ? 'Kapandı' : (faturalar.length ? 'Kısmi faturalı' : 'Açık'));

    return UI.panel(null, null, h('div.stack', {}, [
      h('div.row', {}, [

        (!f.iptal && !faturalar.length) ? h('button.btn.ghost.sm', { text: 'Fişi iptal et', onclick: function () { UI.onay('Fişi iptal et', f.fisNo + ' iptal edilecek. Portal, durum sorgusunda siparişi iptale çeker.', function () { JP.logo.fisIptal(f.fisNo); UI.toast('Fiş iptal edildi', null, 'ok'); }, true); } }) : null
      ]),
      UI.tablo(['Satır', 'Stok', { t: 'Miktar', num: true }, { t: 'Faturalanan', num: true }, { t: 'Kalan', num: true }, 'Miktarı değiştir'],

            h('td', {}, h('div.row.tight', {}, [girdi, h('button.btn.sm', {
              text: 'Uygula', disabled: f.iptal,

                });

          ]);

    ]));
  }

      ]),
      aksiyonlar: function (kapat) {

            onclick: function () {

              h('td.right', {}, f.gib === 'Kesilmedi' ? h('div.row.tight', {}, [
                h('button.btn.primary.sm', { text: "GİB'e gönder", onclick: function () { UI.dene(function () { JP.logo.gibGonder(f.no, true); UI.toast('GİB gönderimi başarılı', f.no, 'ok'); }); } }),
                h('button.btn.ghost.sm', { text: 'Ret simüle et', onclick: function () { UI.dene(function () { JP.logo.gibGonder(f.no, false); UI.toast('GİB reddi', f.no + ' · sipariş kapanmaz.', 'bad'); }); } })
              ]) : (f.gib === 'Hata' ? h('button.btn.sm', { text: 'Yeniden gönder', onclick: function () { UI.dene(function () { JP.logo.gibGonder(f.no, true); UI.toast('GİB gönderimi başarılı', f.no, 'ok'); }); } }) : h('span.small.muted', { text: JP.fmt.saat(f.gibTs) })))
            ]);
          })), true)
    ]);
  }

  /* ------------------------------------------------------------ stok kartları */
  function stok() {
    var db = JP.db;
    return h('div.stack', {}, [
      h('div.row', {}, [
        h('div.small.muted', { text: 'Bu kartlar portalın tek ana veri kaynağıdır. Değişiklikler portala ancak “Ürünleri Logo’dan al” ile yansır.' }),
        h('div.spacer'),
        h('button.btn.sm', { text: 'Stok kartı ekle', onclick: stokEkleKip })
      ]),
      UI.panel(null, null, UI.tablo(['', 'Kod', 'Ad', 'Grup', 'Birim', 'Durum', ''],
        db.logo.stok.map(function (s) {
          return h('tr', {}, [
            h('td', { style: { width: '54px' } }, UI.kartela(s, '34px')),
            h('td.mono.small', { text: s.kod }),
            h('td.small', { text: s.ad }),
            h('td.small.muted', { text: s.grup }),
            h('td.mono.small', { text: s.birim }),
            h('td', {}, s.aktif ? UI.rozet('Aktif', 'ok') : UI.rozet('Pasif', 'warn')),
            h('td.right', {}, h('button.btn.ghost.sm', {
              text: s.aktif ? 'Pasife al' : 'Aktife al',
              onclick: function () { JP.logo.stokDurum(s.kod, !s.aktif); UI.toast('Stok kartı güncellendi', s.kod + ' → ' + (s.aktif ? 'pasif' : 'aktif'), 'ok'); }
            }))
          ]);
        })), true)
    ]);
  }

  function stokEkleKip() {
    var kod = h('input', { type: 'text', placeholder: 'ZEB-1200-GRI' });
    var ad = h('input', { type: 'text', placeholder: 'Zebra Perde Kumaşı 1200 · Gri' });
    var grup = h('select', {}, ['Zebra', 'Stor', 'Tül Stor', 'Sun Screen', 'Plise', 'Sineklik'].map(function (g) { return h('option', { value: g, text: g }); }));
    var birim = h('select', {}, ['MTR', 'ADET'].map(function (b) { return h('option', { value: b, text: b }); }));
    var renk = h('input', { type: 'text', value: '#9AA0A3' });

    UI.modal({
      baslik: 'Stok kartı ekle', etiket: 'Logo ana verisi',
      icerik: h('div.grid.k2', {}, [
        h('label.f', {}, ['Stok kodu', kod]), h('label.f', {}, ['Ad', ad]),
        h('label.f', {}, ['Grup', grup]), h('label.f', {}, ['Birim', birim]),
        h('label.f', {}, ['Kartela rengi', renk])
      ]),
      aksiyonlar: function (kapat) {
        return [
          h('button.btn', { text: 'Vazgeç', onclick: kapat }),
          h('button.btn.primary', {
            text: 'Kartı oluştur',
            onclick: function () {
              UI.dene(function () {
                var doku = { 'Zebra': 'zebra', 'Stor': 'stor', 'Tül Stor': 'tul', 'Sun Screen': 'screen', 'Plise': 'plise', 'Sineklik': 'sineklik' }[grup.value];
                JP.logo.stokEkle(kod.value.trim(), ad.value.trim() || kod.value.trim(), grup.value, birim.value, renk.value, doku);
                kapat(); UI.toast('Stok kartı oluşturuldu', 'Portalda görünmesi için “Ürünleri Logo’dan al” çalıştırın.', 'ok');
              });
            }
          })
        ];
      }
    });
  }

  /* ------------------------------------------------------------ cari kartlar */
  function cari() {
    var db = JP.db;
    return UI.panel(null, h('span.small.muted', { text: 'Yurt içi / yurt dışı ayrımı cari karttan gelir' }),
      UI.tablo(['Kod', 'Unvan', 'Şehir', 'Ülke', 'E-posta', 'Durum', ''],
        db.logo.cari.map(function (c) {
          return h('tr', {}, [
            h('td.mono.small', { text: c.kod }),
            h('td.small', { text: c.unvan }),
            h('td.small.muted', { text: c.sehir }),
            h('td.small.mono', { text: c.ulke }),
            h('td.small.muted', { text: c.eposta }),
            h('td', {}, c.aktif ? UI.rozet('Aktif', 'ok') : UI.rozet('Pasif', 'warn')),
            h('td.right', {}, h('button.btn.ghost.sm', {
              text: c.aktif ? 'Pasife al' : 'Aktife al',
              onclick: function () { JP.logo.cariDurum(c.kod, !c.aktif); UI.toast('Cari kartı güncellendi', c.kod, 'ok'); }
            }))
          ]);
        })), true);
  }
})();

</script>
<script>

(function () {
  'use strict';
  var GIRIS_HTML = `

  <header class="mast">
    <div>
      <div class="eyebrow">Jalpersan Tekstil · B2B bayi satın alma talep portalı</div>
      <h1>Üç ekranı ayrı ayrı çalıştıran prototip</h1>
      <p class="sub">Bayi portalı, firma paneli ve Logo ERP simülatörü üç ayrı pencerede açılır ve
        aynı veriyi paylaşır. Bir pencerede yaptığınız işlem diğerlerine anında yansır.</p>
    </div>
    <div class="meta">
      <span class="poc-flag">Prototip · demo verisi</span>
      <span class="small muted">Teknik doküman v0.6 · bölüm 7</span>
    </div>
  </header>

  <div class="roles">
    <a class="role" href="bayi.html" target="jp-bayi">
      <span class="ord">ROL 01</span>
      <h2>Bayi portalı</h2>
      <p>Ürün kataloğu, satın alma talebi ve kendi havuz dökümü. Fiyat ve stok gösterilmez.</p>
      <span class="go">Bayi penceresini aç →</span>
    </a>
    <a class="role" href="firma.html" target="jp-firma">
      <span class="ord">ROL 02</span>
      <h2>Firma paneli</h2>
      <p>Logo senkronu, ürün ve bayi ek alanları, talep→sipariş dönüşümü, talep havuzu ve raporlar.</p>
      <span class="go">Firma penceresini aç →</span>
    </a>
    <a class="role sim" href="logo.html" target="jp-logo">
      <span class="ord">SİMÜLASYON</span>
      <h2>Logo ERP simülatörü</h2>
      <p>Stok ve cari kartlar, portaldan düşen sipariş fişleri, miktar değişimi, kısmi ve çoklu fatura, GİB gönderimi.</p>
      <span class="go">Logo penceresini aç →</span>
    </a>
  </div>

  <div class="row">
    <button class="btn primary" id="hepsi">Üç pencereyi birden aç</button>
    <button class="btn" id="bastan">Demoyu baştan başlat</button>
    <button class="btn ghost" id="ornek">Örnek veriye dön</button>
    <span class="small muted" id="durum"></span>
  </div>

  <div class="cols">
    <section class="panel">
      <div class="panel-head"><h2>Beş dakikalık demo senaryosu</h2></div>
      <div class="panel-body">
        <div class="steps">
          <div class="step"><div><b>Ürün ve bayi tanımları</b> <span class="where">firma → panel</span>
            <p>“Ürünleri Logo’dan al” ve “Bayileri Logo’dan al”. Bir ürünü siparişe kapatın, bir bayiye yalnızca seçili grupları açın.</p></div></div>
          <div class="step"><div><b>Talep oluşturma</b> <span class="where">bayi → ürün kataloğu</span>
            <p>Bayiyi seçin, miktar girip talebi gönderin. Havuza <em>dTalep</em> giriş hareketi yazılır.</p></div></div>
          <div class="step"><div><b>Siparişe dönüştürme</b> <span class="where">firma → gelen talepler</span>
            <p>Kalem bazında miktarı düşürerek sipariş oluşturun. Kalan miktar havuzda açık kalır.</p></div></div>
          <div class="step"><div><b>Logo’ya gönderim</b> <span class="where">firma → siparişler</span>
            <p>“Logo’ya gönder”. Dilerseniz önce gönderim hatası simüle edip yeniden gönderin.</p></div></div>
          <div class="step"><div><b>Logo tarafı</b> <span class="where">logo → sipariş fişleri</span>
            <p>Fişi görün; miktarı değiştirin, kısmi fatura kesin, ikinci faturayı kesin, GİB’e gönderin.</p></div></div>
          <div class="step"><div><b>Durum sorgusu</b> <span class="where">firma → siparişler</span>
            <p>“Sipariş ve fatura durumunu sorgula”. Miktar değişimi ve faturalar havuza hareket olarak işlenir, sipariş kapanır. Tekrar sorgulayın: mükerrer hareket yazılmaz.</p></div></div>
          <div class="step"><div><b>Havuz kontrolü</b> <span class="where">firma → talep havuzu</span>
            <p>Dört bakiye ve tüm hareket dökümü. “Elle hareket ekle” ile fatura dışı kapatma; “Serbest fatura” ile FIFO ve talep dışı eşleme.</p></div></div>
        </div>
      </div>
    </section>

    <div class="stack">
      <section class="panel">
        <div class="panel-head"><h2>Havuz mantığı</h2></div>
        <div class="panel-body stack">
          <p class="small muted">Bakiye hiçbir yerde saklanmaz; tek bir hareket tablosundan hesaplanır. Kayıt güncellenmez, düzeltme ters hareketle yapılır.</p>
          <div class="form">
            talep&nbsp;&nbsp;&nbsp;&nbsp;= Σ <em>dTalep</em><br>
            siparişte = Σ <em>dRezerv</em><br>
            faturalanan = Σ <em>dFatura</em><br>
            <strong>açık</strong>&nbsp;&nbsp;&nbsp;&nbsp;= talep − siparişte − faturalanan
          </div>
          <p class="small muted">Fatura yazılırken rezerv aynı işlemde kapatılır; aksi halde sipariş faturalanınca miktar iki kez düşer.</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Fatura eşleme</h2></div>
        <div class="panel-body">
          <div class="steps">
            <div class="step"><div><b>Bağlantılı</b><p>Fatura satırında sipariş satır referansı var → deterministik dağıtım.</p></div></div>
            <div class="step"><div><b>FIFO</b><p>Sipariş bağlantısı yok, bayi ve ürün eşleşiyor → en eski açık talepten düşülür.</p></div></div>
            <div class="step"><div><b>Eşleşmeyen</b><p>Talep yok veya talebi aşıyor → talep dışı fatura listesine düşer, elle bağlanır.</p></div></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <footer class="foot">
    Veri yalnızca bu tarayıcıda saklanır; sunucuya hiçbir şey gönderilmez. Üç pencerenin veriyi paylaşması için hepsinin aynı adresten açılması gerekir.
    Gerçek entegrasyona geçişte yalnızca simülatörün yerini Logo servisleri alır; portal ekranları ve iş kuralları değişmez.
  </footer>
`;
  var ROLLER = [
    { id: 'giris', ad: 'Giriş' },
    { id: 'bayi', ad: 'Bayi' },
    { id: 'firma', ad: 'Firma' },
    { id: 'logo', ad: 'Logo' }
  ];

  function rol() {
    var hash = (location.hash || '').replace('#', '');
    if (ROLLER.some(function (r) { return r.id === hash; })) { sessionStorage.setItem('jp.rol', hash); return hash; }
    return sessionStorage.getItem('jp.rol') || 'giris';
  }
  function rolAyarla(r) {
    sessionStorage.setItem('jp.rol', r);
    if (location.hash) { history.replaceState(null, '', location.pathname + location.search); }
    ciz();
  }
  JP.rolAyarla = rolAyarla;

  JP.rolSecici = function () {
    var su = rol();
    return JP.UI.h('div.rol-sec', { role: 'group', 'aria-label': 'Rol seç' }, ROLLER.map(function (r) {
      return JP.UI.h('button', {
        'aria-pressed': String(r.id === su), text: r.ad,
        onclick: function () { rolAyarla(r.id); }
      });
    }));
  };

  function yeniSekme(hedefRol) {
    var p = window.open(location.href.split('#')[0] + '#' + hedefRol, '_blank');
    if (!p) {
      JP.UI.toast('Sekme açılamadı',
        'Tarayıcı yeni sekmeyi engelledi. Bu sayfanın adresini yeni bir sekmede açıp üstteki seçiciden rolü değiştirin — veriyi paylaşırlar.', 'bad');
    }
  }

  function giris() {
    var kok = document.getElementById('app');
    document.documentElement.classList.remove('logo-world');
    if (JP.aboneSifirla) JP.aboneSifirla();
    kok.innerHTML = '<div class="wrap">' + GIRIS_HTML + '</div>';

    kok.querySelectorAll('a.role').forEach(function (a) {
      var hedef = (a.getAttribute('href') || '').replace('.html', '');
      a.setAttribute('href', '#' + hedef);
      a.addEventListener('click', function (e) { e.preventDefault(); rolAyarla(hedef); });
      var git = a.querySelector('.go');
      if (git) git.textContent = git.textContent.replace('penceresini aç', 'ekranına geç').replace('Bayi pencereyi', 'Bayi');
    });

    var d = JP.db;
    kok.querySelector('#durum').textContent =
      d.urunler.length + ' ürün · ' + d.bayiler.length + ' bayi · ' + d.talepler.length +
      ' talep · ' + d.siparisler.length + ' sipariş · ' + d.havuz.length + ' havuz hareketi';

    var hepsi = kok.querySelector('#hepsi');
    hepsi.textContent = 'Bayi ve Logo ekranlarını yeni sekmede aç';
    hepsi.addEventListener('click', function () {
      yeniSekme('bayi');
      setTimeout(function () { yeniSekme('logo'); }, 250);
      setTimeout(function () { rolAyarla('firma'); }, 500);
    });
    kok.querySelector('#bastan').addEventListener('click', function () {
      JP.UI.onay('Demoyu baştan başlat',
        'Portal tarafı (ürün, bayi, talep, sipariş, havuz) boşaltılır. Logo simülatöründeki stok ve cari kartlar kalır.',
        function () { JP.sifirla(true); ciz(); }, true);
    });
    kok.querySelector('#ornek').addEventListener('click', function () {
      JP.UI.onay('Örnek veriye dön', 'Tüm PoC verisi silinip başlangıç örneğine dönülür.',
        function () { JP.sifirla(false); ciz(); }, true);
    });

    kok.querySelector('.wrap').insertBefore(
      JP.UI.h('div.note.giris-ipucu', {
        html: '<b>Üç ekranı yan yana görmek için:</b> bu sayfayı iki sekmede daha açın ve her sekmede üstteki seçiciden ' +
              'farklı bir rol seçin. Sekmeler aynı veriyi paylaşır; birinde yaptığınız işlem diğerlerine anında yansır.'
      }),
      kok.querySelector('.roles')
    );
  }

  function ciz() {
    var r = rol();
    if (r === 'bayi') JP.bayiEkran();
    else if (r === 'firma') JP.firmaEkran();
    else if (r === 'logo') JP.logoEkran();
    else giris();
  }

  window.addEventListener('hashchange', ciz);
  ciz();
})();

</script>
