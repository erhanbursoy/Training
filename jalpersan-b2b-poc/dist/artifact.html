<title>Jalpersan B2B Prototipi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Jalpersan B2B PoC — ortak tasarım sistemi
   Renk: ham pamuk zemin, çam-petrol mürekkep, teal aksan.
   Logo simülatörü .logo-world sınıfıyla kendi koyu dünyasını kurar. */

:root {
  color-scheme: light;

  --paper:      #F6F4EF;
  --surface:    #FFFFFF;
  --surface-2:  #FBFAF6;
  --sunk:       #EEEBE3;
  --line:       #E1DBCF;
  --line-2:     #C8C0B0;

  --text:       #14312E;
  --text-2:     #5A6862;
  --text-3:     #8B948E;

  --accent:     #0F6157;
  --accent-2:   #0B4B43;
  --accent-soft:#E1EFEC;

  --ok:         #3A6B34;  --ok-soft:  #E8F0E3;
  --warn:       #8A6410;  --warn-soft:#F8EFD9;
  --bad:        #A03A28;  --bad-soft: #F9E8E3;
  --info:       #245D7A;  --info-soft:#E4EEF4;

  --shadow:     0 1px 2px rgba(20,49,46,.05), 0 10px 26px -16px rgba(20,49,46,.30);
  --radius:     10px;

  --font-display: Archivo, "Helvetica Neue", Arial, sans-serif;
  --font-body:    "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:#101619; --surface:#161E22; --surface-2:#1B2429; --sunk:#0C1215;
    --line:#28343A; --line-2:#3B4A51;
    --text:#E4EAE7; --text-2:#9CA9A5; --text-3:#6E7C78;
    --accent:#4FBFAE; --accent-2:#7FD6C7; --accent-soft:#123B36;
    --ok:#77BB6B;  --ok-soft:#162A17;
    --warn:#D8A748; --warn-soft:#2E2411;
    --bad:#E28874;  --bad-soft:#341B16;
    --info:#74B3D6; --info-soft:#12262F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:#101619; --surface:#161E22; --surface-2:#1B2429; --sunk:#0C1215;
  --line:#28343A; --line-2:#3B4A51;
  --text:#E4EAE7; --text-2:#9CA9A5; --text-3:#6E7C78;
  --accent:#4FBFAE; --accent-2:#7FD6C7; --accent-soft:#123B36;
  --ok:#77BB6B;  --ok-soft:#162A17;
  --warn:#D8A748; --warn-soft:#2E2411;
  --bad:#E28874;  --bad-soft:#341B16;
  --info:#74B3D6; --info-soft:#12262F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
}

/* Logo ERP simülatörü — bilinçli olarak tek dünyaya bağlı koyu terminal görünümü */
.logo-world {
  color-scheme: dark;
  --paper:#0C1116; --surface:#141C22; --surface-2:#1A242B; --sunk:#080D11;
  --line:#25333B; --line-2:#3A4C56;
  --text:#D8E2E7; --text-2:#93A3AC; --text-3:#67767F;
  --accent:#E0A32E; --accent-2:#F0BE60; --accent-soft:#2C2211;
  --ok:#6FBF73;  --ok-soft:#152616;
  --warn:#E0A32E; --warn-soft:#2C2211;
  --bad:#E9806B;  --bad-soft:#331914;
  --info:#6FB1D4; --info-soft:#122630;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 30px -18px #000;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.012em; }
h1 { font-size: 20px; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
p { margin: 0 0 10px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.eyebrow {
  font-family: var(--font-display); font-size: 10.5px; font-weight: 600;
  letter-spacing: .10em; text-transform: uppercase; color: var(--text-3);
}
.muted   { color: var(--text-2); }
.small   { font-size: 12px; }
.right   { text-align: right; }
.nowrap  { white-space: nowrap; }
.stack   { display: flex; flex-direction: column; gap: 14px; }
.row     { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.spacer  { flex: 1 1 auto; }
.hidden  { display: none !important; }

/* ---------- kabuk ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.brand b {
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  letter-spacing: .06em; text-transform: uppercase;
}
.brand span { font-size: 12px; color: var(--text-2); white-space: nowrap; }

.role-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 11px 4px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-2);
  font-family: var(--font-display); font-size: 11.5px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; border: 1px solid transparent;
}
.role-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.poc-flag {
  font-family: var(--font-display); font-size: 10px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px;
  padding: 2px 7px; white-space: nowrap;
}

.shell { flex: 1 1 auto; display: flex; align-items: flex-start; min-height: 0; }

.rail {
  width: 214px; flex: none; align-self: stretch;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 14px 10px; position: sticky; top: 56px; max-height: calc(100vh - 56px); overflow-y: auto;
}
.rail .eyebrow { padding: 10px 10px 6px; }
.rail button {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 8px 10px; border-radius: 7px; color: var(--text-2);
  font: inherit; font-size: 13.5px;
}
.rail button:hover { background: var(--sunk); color: var(--text); }
.rail button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.rail .count {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 999px;
  background: var(--sunk); color: var(--text-2);
}
.rail button[aria-current="true"] .count { background: var(--surface); }
.rail .count.hot { background: var(--warn); color: #fff; }

.main { flex: 1 1 auto; min-width: 0; padding: 20px 22px 64px; }
.main > header { margin-bottom: 16px; }
.main > header p { color: var(--text-2); max-width: 68ch; margin: 4px 0 0; }

@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .rail {
    width: 100%; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line);
    display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px;
  }
  .rail .eyebrow { display: none; }
  .rail button { width: auto; white-space: nowrap; }
  .main { padding: 16px 14px 56px; }
}

/* ---------- yüzeyler ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius);
}
.panel > .panel-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 14px; border-bottom: 1px solid var(--line);
}
.panel > .panel-head h2 { font-size: 14px; }
.panel > .panel-body { padding: 14px; }
.panel > .panel-body.flush { padding: 0; }

.grid { display: grid; gap: 14px; }
.grid.k2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid.k3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.k4 { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }

/* ---------- ölçüm kutuları ---------- */
.kpi { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.kpi .k { font-family: var(--font-display); font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.kpi .v { font-family: var(--font-mono); font-size: 24px; font-weight: 500; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .u { font-size: 12px; color: var(--text-2); margin-left: 3px; font-family: var(--font-body); }
.kpi .s { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
.kpi.on-accent { background: var(--accent-soft); border-color: transparent; }
.kpi.on-accent .v, .kpi.on-accent .k { color: var(--accent-2); }

/* ---------- tablo ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th {
  font-family: var(--font-display); font-size: 10.5px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase; color: var(--text-3);
  text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
  white-space: nowrap; background: var(--surface-2); position: sticky; top: 0;
}
table.tbl th.num, table.tbl td.num { text-align: right; }
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl tbody tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover td { background: var(--surface-2); }
table.tbl tr.sub td { background: var(--sunk); font-size: 12px; }
table.tbl td.tight { padding: 5px 12px; }
.empty { padding: 26px 14px; text-align: center; color: var(--text-3); font-size: 13px; }

/* ---------- rozetler ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
  background: var(--sunk); color: var(--text-2);
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge.plain::before { display: none; }
.badge.ok   { background: var(--ok-soft);   color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad  { background: var(--bad-soft);  color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.acc  { background: var(--accent-soft); color: var(--accent-2); }

.tag {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 6px;
  border: 1px solid var(--line-2); border-radius: 4px; color: var(--text-2); white-space: nowrap;
}

/* ---------- düğmeler ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-size: 13px; font-weight: 500; line-height: 1;
  padding: 8px 13px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--text);
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--sunk); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.logo-world .btn.primary { color: #201704; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--sunk); color: var(--text); }
.btn.sm { font-size: 12px; padding: 5px 9px; border-radius: 6px; }
.btn.block { width: 100%; }

/* ---------- form ---------- */
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-2); }
input[type=text], input[type=number], input[type=date], input[type=email], select, textarea {
  font: inherit; font-size: 13px; color: var(--text);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px;
  padding: 7px 9px; width: 100%; min-width: 0;
}
input[type=number] { font-family: var(--font-mono); text-align: right; }
textarea { resize: vertical; min-height: 62px; }
input:disabled, select:disabled { background: var(--sunk); color: var(--text-3); }
input.qty, input[type=number].qty { width: 88px; flex: none; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg button { font: inherit; font-size: 12.5px; padding: 6px 11px; border: 0; background: var(--surface); color: var(--text-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 500; }
.logo-world .seg button[aria-pressed="true"] { color: #201704; }

/* ---------- havuz bakiye bandı ---------- */
.bar { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: var(--sunk); min-width: 110px; }
.bar i { display: block; height: 100%; }
.bar .b-fat { background: var(--ok); }
.bar .b-rez { background: var(--info); }
.bar .b-acik { background: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- kumaş dokusu (kartela) ---------- */
.swatch {
  width: 100%; aspect-ratio: 16 / 9; border-radius: 7px; border: 1px solid var(--line);
  background-color: var(--sw, #B9AE99); background-blend-mode: multiply; position: relative; overflow: hidden;
}
.swatch.sw-zebra    { background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.92) 0 6px, rgba(0,0,0,.34) 6px 12px); }
.swatch.sw-stor     { background-image: linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.10)), repeating-linear-gradient(90deg, rgba(0,0,0,.045) 0 3px, transparent 3px 7px); }
.swatch.sw-tul      { background-image: radial-gradient(circle, rgba(255,255,255,.95) 1.1px, transparent 1.6px); background-size: 5px 5px; }
.swatch.sw-screen   { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.42) 0 1px, transparent 1px 5px), repeating-linear-gradient(90deg, rgba(0,0,0,.42) 0 1px, transparent 1px 5px); }
.swatch.sw-plise    { background-image: repeating-linear-gradient(118deg, rgba(255,255,255,.78) 0 3px, rgba(0,0,0,.02) 3px 8px, rgba(0,0,0,.30) 8px 11px); }
.swatch.sw-sineklik { background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.62) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.62) 0 1px, transparent 1px 3px); }
.swatch.sw-diger    { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.08) 0 6px, transparent 6px 12px); }

/* ---------- ürün kartı ---------- */
.cat { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); }
.prod { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
.prod .pb { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; }
.prod .pn { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.prod .pc { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.prod .pd { font-size: 12px; color: var(--text-2); flex: 1 1 auto; }
.prod .pf { display: flex; align-items: center; gap: 7px; }
.prod .pf .unit { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.prod.kapali { opacity: .55; }

/* ---------- bildirim / kip ---------- */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; max-width: min(400px, 92vw); }
.toast {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 10px 13px; box-shadow: var(--shadow); font-size: 13px;
  animation: pop .18s ease-out;
}
.toast.ok  { border-left-color: var(--ok); }
.toast.bad { border-left-color: var(--bad); }
.toast b { display: block; font-family: var(--font-display); font-size: 12.5px; margin-bottom: 1px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.modal-bg {
  position: fixed; inset: 0; z-index: 80; background: rgba(10,22,20,.45);
  display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px 14px; overflow-y: auto;
}
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); width: min(760px, 100%); }
.modal.wide { width: min(1040px, 100%); }
.modal > header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.modal > .mb { padding: 16px; }
.modal > footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 12px 12px; }

/* ---------- notlar / uyarı şeridi ---------- */
.note {
  border: 1px solid var(--line); border-left: 3px solid var(--info); background: var(--info-soft);
  color: var(--text); border-radius: 8px; padding: 10px 13px; font-size: 12.5px;
}
.note.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.note.bad  { border-left-color: var(--bad);  background: var(--bad-soft); }
.note b { font-family: var(--font-display); }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; align-items: baseline; }
.kv dt { color: var(--text-3); font-size: 12px; }
.kv dd { margin: 0; }

.ledger { font-size: 12.5px; }
.ledger .sgn-pos { color: var(--ok); }
.ledger .sgn-neg { color: var(--bad); }
.src { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-family: var(--font-display); font-weight: 600; }
.src.portal { color: var(--accent-2); }
.src.logo   { color: var(--info); }
.src.elle   { color: var(--warn); }

/* katalog grup başlığı — tek ürünlü grup için panel yerine hafif ayraç */
.grp { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 -4px; }
.grp h2 { font-size: 15px; }
.grp .rule { flex: 1 1 auto; height: 1px; background: var(--line); }
.grp .adet { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }


  .wrap { max-width: 1080px; margin: 0 auto; padding: 34px 22px 72px; }
  .mast { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .mast h1 { font-size: 30px; letter-spacing: -.022em; line-height: 1.12; }
  .mast .sub { color: var(--text-2); max-width: 56ch; margin-top: 8px; }
  .mast .meta { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }

  .roles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(272px, 1fr)); margin: 24px 0; }
  .role {
    display: flex; flex-direction: column; gap: 11px; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--surface);
    box-shadow: var(--shadow); transition: transform .14s ease, border-color .14s ease;
  }
  .role:hover { transform: translateY(-2px); border-color: var(--accent); }
  .role .ord { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); letter-spacing: .08em; }
  .role h2 { font-size: 18px; }
  .role p { color: var(--text-2); font-size: 13px; margin: 0; flex: 1 1 auto; }
  .role .go { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
  .role.sim {
    background: #101820; border-color: #26333B; color: #D8E2E7;
    background-image: repeating-linear-gradient(0deg, rgba(224,163,46,.05) 0 1px, transparent 1px 5px);
  }
  .role.sim p { color: #93A3AC; }
  .role.sim .ord { color: #67767F; }
  .role.sim .go { color: #E0A32E; }
  .role.sim:hover { border-color: #E0A32E; }

  .steps { counter-reset: s; display: grid; gap: 2px; }

<div id="app"></div>
<script>
/* Jalpersan B2B PoC — çekirdek veri modeli ve iş kuralları
 *
 * Tasarım ilkeleri (teknik doküman v0.6, bölüm 3.6–3.7):
 *  - Ana veri sahibi Logo'dur. Ürün ve bayi kartları db.logo altında durur;
 *    portal kopyası ancak "Logo'dan al" tetiklendiğinde oluşur.
 *  - Havuz bakiyesi HİÇBİR YERDE saklanmaz. Yalnızca db.havuz hareketlerinden
 *    türetilir. Kayıt güncellenmez; düzeltme ters hareketle yapılır.
 *  - Fatura yazılırken rezerv aynı işlemde kapatılır (dFatura + / dRezerv -),
 *    aksi halde sipariş faturalanınca miktar iki kez düşer.
 *  - Logo kaynaklı her hareketin benzersiz bir ref'i vardır; sorgu kaç kez
 *    tetiklenirse tetiklensin aynı hareket ikinci kez yazılmaz.
 */
(function () {
  'use strict';
  var JP = (window.JP = window.JP || {});

  JP.KEY = 'jalpersan.poc.v3';
  JP.SURUM = 'PoC 1.0 · doküman v0.6';

  /* ---------------------------------------------------------------- yardımcı */
  var _ts = null;                              // seed sırasında tarih geriye alınır
  function now() { return _ts || new Date().toISOString(); }
  function uid(p) { return (p || 'x') + Math.random().toString(36).slice(2, 9); }
  function gunFark(iso) { return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
  function gecmis(gun) {
    var d = new Date(); d.setDate(d.getDate() - gun); d.setHours(9, 30, 0, 0);
    return d.toISOString();
  }
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function yil() { return new Date().getFullYear(); }
  function r2(n) { return Math.round(n * 100) / 100; }

  JP.gunFark = gunFark;
  JP.fmt = {
    miktar: function (n) { return (Math.round(n * 100) / 100).toLocaleString('tr-TR'); },
    tarih: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return pad(d.getDate(), 2) + '.' + pad(d.getMonth() + 1, 2) + '.' + d.getFullYear();
    },
    saat: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return JP.fmt.tarih(iso) + ' ' + pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2);
    }
  };

  /* ------------------------------------------------------------------ depo */
  var mem = null, dinleyiciler = [], kanal = null;
  JP.depoEngeli = false;

  try { kanal = new BroadcastChannel('jalpersan-poc'); } catch (e) { kanal = null; }

  function oku() {
    try {
      var ham = localStorage.getItem(JP.KEY);
      if (ham) return JSON.parse(ham);
    } catch (e) { JP.depoEngeli = true; }
    return null;
  }
  function yaz(db) {
    mem = db;
    try { localStorage.setItem(JP.KEY, JSON.stringify(db)); }
    catch (e) { JP.depoEngeli = true; }
  }

  Object.defineProperty(JP, 'db', {
    get: function () {
      if (!mem) { mem = oku(); if (!mem) { mem = tohum(); yaz(mem); } }
      return mem;
    }
  });

  /** Tek yazma noktası: değişikliği kaydeder, diğer sekmeleri uyandırır. */
  JP.tx = function (fn) {
    var db = JP.db;
    var sonuc = fn(db);
    db.meta.rev = (db.meta.rev || 0) + 1;
    db.meta.sonYazma = now();
    yaz(db);
    if (kanal) { try { kanal.postMessage({ rev: db.meta.rev }); } catch (e) {} }
    yayinla();
    return sonuc;
  };

  function yayinla() { dinleyiciler.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }
  JP.abone = function (fn) { dinleyiciler.push(fn); };
  JP.aboneSifirla = function () { dinleyiciler.length = 0; };   // rol değişiminde ölü kabuk yeniden çizilmesin

  function disaridanDegisti() { mem = oku() || mem; yayinla(); }
  if (kanal) kanal.onmessage = disaridanDegisti;
  window.addEventListener('storage', function (e) { if (e.key === JP.KEY) disaridanDegisti(); });

  JP.sifirla = function (bos) {
    mem = tohum(bos);
    JP.tx(function () {});
  };

  /* --------------------------------------------------------- ana veri (Logo) */
  function logoStok() {
    var s = [
      ['ZEB-1200-KREM', 'Zebra Perde Kumaşı 1200 · Krem', 'Zebra', 'MTR', '#D8C9AC', 'zebra'],
      ['ZEB-1200-ANTR', 'Zebra Perde Kumaşı 1200 · Antrasit', 'Zebra', 'MTR', '#5A6068', 'zebra'],
      ['ZEB-2400-BEJ', 'Zebra Perde Kumaşı 2400 · Bej', 'Zebra', 'MTR', '#C9B394', 'zebra'],
      ['STR-3000-BEYAZ', 'Stor Perde Kumaşı 3000 · Beyaz', 'Stor', 'MTR', '#EDE9E1', 'stor'],
      ['STR-3000-GRI', 'Stor Perde Kumaşı 3000 · Gri', 'Stor', 'MTR', '#9AA0A3', 'stor'],
      ['TUL-0500-EKRU', 'Tül Stor 0500 · Ekru', 'Tül Stor', 'MTR', '#E7E2D6', 'tul'],
      ['SSC-0310-GUMUS', 'Sun Screen %3 Açıklık · Gümüş', 'Sun Screen', 'MTR', '#A9AEB2', 'screen'],
      ['SSC-0510-BEYAZ', 'Sun Screen %5 Açıklık · Beyaz', 'Sun Screen', 'MTR', '#DDD9D2', 'screen'],
      ['PLS-0900-VIZON', 'Plise Perde Kumaşı 0900 · Vizon', 'Plise', 'MTR', '#B9A791', 'plise'],
      ['SNK-1800-SIYAH', 'Sineklik Tülü 1800 · Siyah', 'Sineklik', 'MTR', '#3C4145', 'sineklik'],
      ['ZEB-1200-KARTELA', 'Zebra Kartela Seti (12 renk)', 'Zebra', 'ADET', '#C2A87C', 'diger']
    ];
    return s.map(function (x, i) {
      return {
        kod: x[0], ad: x[1], grup: x[2], birim: x[3], renk: x[4], doku: x[5],
        aktif: x[0] !== 'SNK-1800-SIYAH',      // Logo'da bir kart pasif — senkron davranışı gösterilsin
        sira: i
      };
    });
  }

  function logoCari() {
    return [
      { kod: 'BYI-0001', unvan: 'Anadolu Perde Dekorasyon Ltd. Şti.', sehir: 'Ankara', ulke: 'TR', aktif: true, eposta: 'siparis@anadoluperde.example' },
      { kod: 'BYI-0002', unvan: 'Ege Stor Sistemleri A.Ş.', sehir: 'İzmir', ulke: 'TR', aktif: true, eposta: 'satinalma@egestor.example' },
      { kod: 'BYI-0003', unvan: 'Marmara Tekstil Dış Tic. Ltd.', sehir: 'İstanbul', ulke: 'TR', aktif: true, eposta: 'info@marmaratekstil.example' },
      { kod: 'BYI-0004', unvan: 'Balkan Home Textile DOO', sehir: 'Belgrad', ulke: 'RS', aktif: true, eposta: 'orders@balkanhome.example' },
      { kod: 'BYI-0005', unvan: 'Lefkoşa Perde Ltd.', sehir: 'Lefkoşa', ulke: 'KKTC', aktif: false, eposta: 'lefkosa@perde.example' }
    ];
  }

  function bosDb() {
    return {
      meta: { rev: 0, kuruldu: now(), sonYazma: now() },
      sayac: { talep: 0, siparis: 0, logoFis: 0, fatura: 0 },
      urunler: [], bayiler: [], talepler: [], siparisler: [],
      havuz: [], talepDisi: [], log: [], bildirim: [],
      senkron: { urun: null, cari: null, siparis: null, fatura: null },
      logo: { stok: logoStok(), cari: logoCari(), fisler: [], faturalar: [] }
    };
  }

  /* ------------------------------------------------------- havuz hareketleri */
  /** Tek hareket ekleme noktası. Logo kaynaklı hareketler ref ile tekilleştirilir. */
  function hareket(db, h) {
    if (h.ref && db.havuz.some(function (x) { return x.ref === h.ref; })) return null;   // idempotency
    var kayit = {
      id: uid('h'), ts: h.ts || now(),
      bayiKod: h.bayiKod, urunKod: h.urunKod,
      tip: h.tip,                       // dTalep | dRezerv | dFatura
      miktar: r2(h.miktar),
      kaynak: h.kaynak || 'portal',     // portal | logo | elle
      ref: h.ref || null,
      talepNo: h.talepNo || null, talepKalemId: h.talepKalemId || null,
      siparisNo: h.siparisNo || null, belge: h.belge || null,
      eslesme: h.eslesme || null,       // baglantili | fifo | elle
      sebep: h.sebep || null,
      kullanici: h.kullanici || 'sistem',
      aciklama: h.aciklama || ''
    };
    db.havuz.push(kayit);
    return kayit;
  }

  function topla(hareketler, tip) {
    return r2(hareketler.reduce(function (t, h) { return h.tip === tip ? t + h.miktar : t; }, 0));
  }

  /** Bir hareket kümesinin dört bakiyesi. Açık = talep − siparişte − faturalanan. */
  function bakiye(hareketler) {
    var talep = topla(hareketler, 'dTalep');
    var rezerv = topla(hareketler, 'dRezerv');
    var fatura = topla(hareketler, 'dFatura');
    return { talep: talep, rezerv: rezerv, fatura: fatura, acik: r2(talep - rezerv - fatura) };
  }
  JP.bakiye = bakiye;

  JP.havuzBakiye = function (bayiKod, urunKod) {
    return bakiye(JP.db.havuz.filter(function (h) {
      return (!bayiKod || h.bayiKod === bayiKod) && (!urunKod || h.urunKod === urunKod);
    }));
  };

  JP.kalemBakiye = function (talepKalemId) {
    return bakiye(JP.db.havuz.filter(function (h) { return h.talepKalemId === talepKalemId; }));
  };

  /** Havuzu bayi × ürün kırılımında döker. */
  JP.havuzOzet = function (filtre) {
    filtre = filtre || {};
    var grup = {};
    JP.db.havuz.forEach(function (h) {
      if (filtre.bayiKod && h.bayiKod !== filtre.bayiKod) return;
      var k = h.bayiKod + '|' + h.urunKod;
      (grup[k] = grup[k] || { bayiKod: h.bayiKod, urunKod: h.urunKod, hareketler: [] }).hareketler.push(h);
    });
    return Object.keys(grup).map(function (k) {
      var g = grup[k], b = bakiye(g.hareketler);
      var enEski = g.hareketler.filter(function (h) { return h.tip === 'dTalep' && h.miktar > 0; })
        .map(function (h) { return h.ts; }).sort()[0];
      return {
        bayiKod: g.bayiKod, urunKod: g.urunKod,
        talep: b.talep, rezerv: b.rezerv, fatura: b.fatura, acik: b.acik,
        yas: enEski ? gunFark(enEski) : 0, hareketSayisi: g.hareketler.length
      };
    }).filter(function (r) { return filtre.sadeceAcik ? r.acik > 0.001 : true; })
      .sort(function (a, b) { return b.acik - a.acik || a.bayiKod.localeCompare(b.bayiKod); });
  };

  /* ------------------------------------------------------------- kayıt/günlük */
  function log(db, yon, islem, ozet, hata) {
    db.log.unshift({ id: uid('l'), ts: now(), yon: yon, islem: islem, ozet: ozet, hata: !!hata });
    if (db.log.length > 400) db.log.length = 400;
  }
  function bildir(db, kime, baslik, metin) {
    db.bildirim.unshift({ id: uid('n'), ts: now(), kime: kime, baslik: baslik, metin: metin });
    if (db.bildirim.length > 120) db.bildirim.length = 120;
  }
  JP.log = log;

  /* --------------------------------------------- Logo → portal ana veri çekme */
  JP.logoUrunleriCek = function () {
    return JP.tx(function (db) {
      var yeni = 0, guncel = 0, pasif = 0;
      db.logo.stok.forEach(function (s) {
        var p = db.urunler.find(function (u) { return u.kod === s.kod; });
        if (!p) {
          db.urunler.push({
            kod: s.kod, ad: s.ad, grup: s.grup, birim: s.birim, renk: s.renk, doku: s.doku,
            logoAktif: s.aktif, logodaYok: false,
            siparieAcik: s.aktif, aciklama: '', gosterimBirimi: s.birim === 'MTR' ? 'metre' : 'adet', sira: s.sira
          });
          yeni++;
        } else {
          if (p.ad !== s.ad || p.logoAktif !== s.aktif || p.grup !== s.grup) guncel++;
          p.ad = s.ad; p.grup = s.grup; p.birim = s.birim; p.renk = s.renk; p.doku = s.doku;
          p.logoAktif = s.aktif; p.logodaYok = false;                 // portal ek alanları korunur
        }
      });
      db.urunler.forEach(function (u) {
        if (!db.logo.stok.some(function (s) { return s.kod === u.kod; })) { u.logodaYok = true; pasif++; }
      });
      db.senkron.urun = { ts: now(), yeni: yeni, guncel: guncel, pasif: pasif, toplam: db.logo.stok.length };
      log(db, 'logo', 'Stok kartı okuma', 'LG_025_ITEMS · ' + db.logo.stok.length + ' kart okundu, ' + yeni + ' yeni, ' + guncel + ' güncellendi');
      return db.senkron.urun;
    });
  };

  JP.logoBayileriCek = function () {
    return JP.tx(function (db) {
      var yeni = 0, guncel = 0, pasif = 0;
      db.logo.cari.forEach(function (c) {
        var b = db.bayiler.find(function (x) { return x.kod === c.kod; });
        if (!b) {
          db.bayiler.push({
            kod: c.kod, unvan: c.unvan, sehir: c.sehir, ulke: c.ulke, eposta: c.eposta,
            logoAktif: c.aktif, logodaYok: false,
            siparisAcik: c.aktif, kisit: { tip: 'tumu', gruplar: [], urunler: [] }, teslimatNotu: ''
          });
          yeni++;
        } else {
          if (b.unvan !== c.unvan || b.logoAktif !== c.aktif) guncel++;
          b.unvan = c.unvan; b.sehir = c.sehir; b.ulke = c.ulke; b.logoAktif = c.aktif; b.logodaYok = false;
        }
      });
      db.bayiler.forEach(function (b) {
        if (!db.logo.cari.some(function (c) { return c.kod === b.kod; })) { b.logodaYok = true; pasif++; }
      });
      db.senkron.cari = { ts: now(), yeni: yeni, guncel: guncel, pasif: pasif, toplam: db.logo.cari.length };
      log(db, 'logo', 'Cari kartı okuma', 'LG_025_CLCARD · ' + db.logo.cari.length + ' kart okundu, ' + yeni + ' yeni, ' + guncel + ' güncellendi');
      return db.senkron.cari;
    });
  };

  /* -------------------------------------------------------- bayi görünürlüğü */
  JP.bayiUrunleri = function (bayiKod) {
    var db = JP.db, b = db.bayiler.find(function (x) { return x.kod === bayiKod; });
    if (!b) return [];
    return db.urunler.filter(function (u) {
      if (!u.siparieAcik || !u.logoAktif || u.logodaYok) return false;
      if (b.kisit.tip === 'gruplar') return b.kisit.gruplar.indexOf(u.grup) >= 0;
      if (b.kisit.tip === 'urunler') return b.kisit.urunler.indexOf(u.kod) >= 0;
      return true;
    }).sort(function (a, b2) { return a.grup.localeCompare(b2.grup) || a.sira - b2.sira; });
  };

  /* --------------------------------------------------- 3.4 satın alma talebi */
  JP.talepOlustur = function (bayiKod, satirlar, not, teslimTarihi) {
    return JP.tx(function (db) {
      var bayi = db.bayiler.find(function (b) { return b.kod === bayiKod; });
      if (!bayi) throw new Error('Bayi bulunamadı.');
      if (!bayi.siparisAcik) throw new Error('Bu bayi siparişe kapalı; yeni talep oluşturulamaz.');
      var temiz = satirlar.filter(function (s) { return s.miktar > 0; });
      if (!temiz.length) throw new Error('En az bir ürüne miktar girin.');

      db.sayac.talep++;
      var no = 'ST-' + yil() + '-' + pad(db.sayac.talep, 6);
      var talep = {
        no: no, bayiKod: bayiKod, tarih: now(), not: not || '',
        teslimTarihi: teslimTarihi || null, iptal: false,
        kalemler: temiz.map(function (s) {
          return { id: uid('k'), urunKod: s.urunKod, miktar: r2(s.miktar) };
        })
      };
      db.talepler.unshift(talep);
      talep.kalemler.forEach(function (k) {
        hareket(db, {
          bayiKod: bayiKod, urunKod: k.urunKod, tip: 'dTalep', miktar: k.miktar,
          kaynak: 'portal', talepNo: no, talepKalemId: k.id, belge: no,
          kullanici: bayiKod, aciklama: 'Satın alma talebi açıldı'
        });
      });
      log(db, 'portal', 'Talep oluşturuldu', no + ' · ' + bayi.unvan + ' · ' + talep.kalemler.length + ' kalem');
      bildir(db, 'muhasebe', 'Yeni satın alma talebi', no + ' — ' + bayi.unvan + ' (' + talep.kalemler.length + ' kalem)');
      return talep;
    });
  };

  /** Bayi/muhasebe kalem miktarını düşürür. Siparişe dönen veya faturalanan kısım düşürülemez. */
  JP.talepKalemAzalt = function (talepNo, kalemId, yeniMiktar, kullanici) {
    return JP.tx(function (db) {
      var t = db.talepler.find(function (x) { return x.no === talepNo; });
      var k = t && t.kalemler.find(function (x) { return x.id === kalemId; });
      if (!k) throw new Error('Kalem bulunamadı.');
      var b = bakiye(db.havuz.filter(function (h) { return h.talepKalemId === kalemId; }));
      var taban = r2(b.rezerv + b.fatura);
      yeniMiktar = r2(Math.max(0, yeniMiktar));
      if (yeniMiktar < taban) throw new Error('Bu kalemin ' + JP.fmt.miktar(taban) + ' birimi siparişe dönmüş veya faturalanmış; altına inilemez.');
      var fark = r2(yeniMiktar - b.talep);
      if (!fark) return;
      hareket(db, {
        bayiKod: t.bayiKod, urunKod: k.urunKod, tip: 'dTalep', miktar: fark,
        kaynak: 'portal', talepNo: talepNo, talepKalemId: kalemId, belge: talepNo,
        kullanici: kullanici || t.bayiKod,
        aciklama: fark < 0 ? 'Talep azaltıldı / iptal' : 'Talep artırıldı'
      });
      log(db, 'portal', 'Talep kalemi güncellendi', talepNo + ' · ' + k.urunKod + ' → ' + JP.fmt.miktar(yeniMiktar));
    });
  };

  JP.talepDurumu = function (talep) {
    if (talep.iptal) return 'İptal';
    var db = JP.db, toplam = 0, rezerv = 0, fatura = 0;
    talep.kalemler.forEach(function (k) {
      var b = bakiye(db.havuz.filter(function (h) { return h.talepKalemId === k.id; }));
      toplam += b.talep; rezerv += b.rezerv; fatura += b.fatura;
    });
    if (toplam <= 0.001) return 'İptal';
    if (fatura >= toplam - 0.001) return 'Tamamlandı';
    if (rezerv + fatura >= toplam - 0.001) return 'Karşılandı';
    if (rezerv + fatura > 0.001) return 'Kısmen Karşılandı';
    return 'Açık';
  };

  /** Muhasebe ekranı: bir talebin kalem kalem dönüştürülebilir miktarları. */
  JP.talepKalemDurum = function (talep) {
    var db = JP.db;
    return talep.kalemler.map(function (k) {
      var b = bakiye(db.havuz.filter(function (h) { return h.talepKalemId === k.id; }));
      var u = db.urunler.find(function (x) { return x.kod === k.urunKod; }) || { ad: k.urunKod, birim: '', doku: 'diger', renk: '#B9AE99' };
      return {
        kalem: k, urun: u, talep: b.talep, rezerv: b.rezerv, fatura: b.fatura,
        acik: b.acik, donusturulebilir: Math.max(0, b.acik)
      };
    });
  };

  /* ------------------------------------------- 3.5 talep → sipariş dönüşümü */
  JP.siparisOlustur = function (bayiKod, secim, kullanici) {
    return JP.tx(function (db) {
      var temiz = secim.filter(function (s) { return s.miktar > 0; });
      if (!temiz.length) throw new Error('Siparişe dönüştürmek için en az bir kaleme miktar girin.');

      temiz.forEach(function (s) {
        var b = bakiye(db.havuz.filter(function (h) { return h.talepKalemId === s.kalemId; }));
        if (s.miktar > b.acik + 0.001) {
          throw new Error('Talep kaleminde yalnızca ' + JP.fmt.miktar(b.acik) + ' birim açıkta; ' + JP.fmt.miktar(s.miktar) + ' sipariş edilemez.');
        }
      });

      db.sayac.siparis++;
      var no = 'S-' + yil() + '-' + pad(db.sayac.siparis, 6);
      var siparis = {
        no: no, bayiKod: bayiKod, tarih: now(), durum: 'Taslak',
        logoFisNo: null, logoRef: 'PORTAL-' + no, hataMetni: null,
        kalemler: temiz.map(function (s) {
          var t = db.talepler.find(function (x) { return x.no === s.talepNo; });
          var k = t.kalemler.find(function (x) { return x.id === s.kalemId; });
          return {
            id: uid('sk'), urunKod: k.urunKod, miktar: r2(s.miktar),
            talepNo: s.talepNo, talepKalemId: s.kalemId,
            logoMiktar: r2(s.miktar),     // Logo'da bilinen son miktar
            faturalanan: 0
          };
        })
      };
      db.siparisler.unshift(siparis);
      siparis.kalemler.forEach(function (sk) {
        hareket(db, {
          bayiKod: bayiKod, urunKod: sk.urunKod, tip: 'dRezerv', miktar: sk.miktar,
          kaynak: 'portal', siparisNo: no, talepNo: sk.talepNo, talepKalemId: sk.talepKalemId,
          belge: no, kullanici: kullanici || 'muhasebe', aciklama: 'Sipariş oluşturuldu (rezerve)'
        });
      });
      var bayi = db.bayiler.find(function (b) { return b.kod === bayiKod; });
      log(db, 'portal', 'Sipariş oluşturuldu', no + ' · ' + (bayi ? bayi.unvan : bayiKod) + ' · ' + siparis.kalemler.length + ' kalem');
      return siparis;
    });
  };

  JP.siparisLogoyaGonder = function (siparisNo, hataSimule) {
    return JP.tx(function (db) {
      var s = db.siparisler.find(function (x) { return x.no === siparisNo; });
      if (!s) throw new Error('Sipariş bulunamadı.');
      if (s.durum !== 'Taslak' && s.durum !== 'Gönderim Hatası') throw new Error('Bu sipariş zaten Logo\'ya iletilmiş.');

      if (hataSimule) {
        s.durum = 'Gönderim Hatası';
        s.hataMetni = 'Logo REST servisine ulaşılamadı (HTTP 503). Sipariş portalda korunuyor, yeniden gönderilebilir.';
        log(db, 'logo', 'Sipariş gönderimi', siparisNo + ' · gönderim başarısız (HTTP 503)', true);
        return s;
      }

      // Idempotency: aynı portal referansı için ikinci fiş açılmaz.
      var mevcut = db.logo.fisler.find(function (f) { return f.portalRef === s.logoRef; });
      if (!mevcut) {
        db.sayac.logoFis++;
        mevcut = {
          fisNo: 'SIP-' + yil() + '-' + pad(db.sayac.logoFis, 6),
          portalRef: s.logoRef, portalSiparisNo: s.no, cariKod: s.bayiKod,
          tarih: now(), durum: 'Açık', iptal: false,
          satirlar: s.kalemler.map(function (k, i) {
            return { id: 'r' + (i + 1), portalKalemId: k.id, stokKod: k.urunKod, miktar: k.miktar, surum: 1 };
          })
        };
        db.logo.fisler.unshift(mevcut);
      }
      s.logoFisNo = mevcut.fisNo;
      s.durum = "Logo'ya İletildi";
      s.hataMetni = null;
      log(db, 'logo', 'Sipariş gönderimi', siparisNo + ' → Logo fiş ' + mevcut.fisNo + ' (ref ' + s.logoRef + ')');
      return s;
    });
  };

  JP.siparisIptal = function (siparisNo, kullanici) {
    return JP.tx(function (db) {
      var s = db.siparisler.find(function (x) { return x.no === siparisNo; });
      if (!s) throw new Error('Sipariş bulunamadı.');
      if (s.durum === 'Tamamlandı' || s.durum === 'İptal') throw new Error('Bu sipariş iptal edilemez.');
      s.kalemler.forEach(function (k) {
        var acikRezerv = r2(k.logoMiktar - k.faturalanan);
        if (acikRezerv > 0.001) {
          hareket(db, {
            bayiKod: s.bayiKod, urunKod: k.urunKod, tip: 'dRezerv', miktar: -acikRezerv,
            kaynak: 'portal', siparisNo: s.no, talepNo: k.talepNo, talepKalemId: k.talepKalemId,
            belge: s.no, kullanici: kullanici || 'muhasebe', aciklama: 'Sipariş iptali (rezerv çözüldü)'
          });
        }
      });
      s.durum = 'İptal';
      log(db, 'portal', 'Sipariş iptali', s.no + ' iptal edildi. Logo fişi ' + (s.logoFisNo || '—') + ' elle iptal edilmelidir.');
      return s;
    });
  };

  /* ------------------------------- 3.1 + 3.7 Logo durum sorgusu ve fatura eşleme */
  /**
   * Logo'dan sipariş ve fatura durumunu okur:
   *  1) fiş miktar değişimi → dRezerv düzeltmesi
   *  2) fişe bağlı fatura satırı → kademe 1 (bağlantılı): dFatura + / dRezerv −
   *  3) fişsiz (serbest) fatura → kademe 2 (FIFO) veya kademe 3 (eşleşmeyen)
   *  4) tüm kalemler faturalandı + GİB başarılı → sipariş 'Tamamlandı'
   */
  JP.durumSorgula = function (siparisNo) {
    return JP.tx(function (db) {
      var sonuc = { okunanFis: 0, miktarDegisimi: 0, faturaHareketi: 0, fifo: 0, eslesmeyen: 0, kapanan: 0, atlanan: 0 };
      var hedef = db.siparisler.filter(function (s) {
        if (siparisNo) return s.no === siparisNo;
        return s.durum === "Logo'ya İletildi" || s.durum === 'Faturalandı';   // tamamlananlar tekrar sorgulanmaz
      });

      hedef.forEach(function (s) {
        var fis = db.logo.fisler.find(function (f) { return f.portalRef === s.logoRef; });
        if (!fis) return;
        sonuc.okunanFis++;

        if (fis.iptal && s.durum !== 'İptal') {
          s.kalemler.forEach(function (k) {
            var acik = r2(k.logoMiktar - k.faturalanan);
            if (acik > 0.001) {
              hareket(db, {
                bayiKod: s.bayiKod, urunKod: k.urunKod, tip: 'dRezerv', miktar: -acik,
                kaynak: 'logo', ref: 'logo:fis:' + fis.fisNo + ':iptal', siparisNo: s.no,
                talepNo: k.talepNo, talepKalemId: k.talepKalemId, belge: fis.fisNo,
                kullanici: 'logo', aciklama: "Logo'da sipariş fişi iptal edildi"
              });
            }
          });
          s.durum = 'İptal';
          log(db, 'logo', 'Sipariş durumu', s.no + ' · Logo fişi iptal edilmiş, portal siparişi iptale çekildi', true);
          return;
        }

        // 1) miktar değişimi
        fis.satirlar.forEach(function (r) {
          var k = s.kalemler.find(function (x) { return x.id === r.portalKalemId; });
          if (!k) return;
          if (r2(r.miktar) === r2(k.logoMiktar)) return;
          var fark = r2(r.miktar - k.logoMiktar);
          var yazildi = hareket(db, {
            bayiKod: s.bayiKod, urunKod: k.urunKod, tip: 'dRezerv', miktar: fark,
            kaynak: 'logo', ref: 'logo:fis:' + fis.fisNo + ':' + r.id + ':v' + r.surum,
            siparisNo: s.no, talepNo: k.talepNo, talepKalemId: k.talepKalemId, belge: fis.fisNo,
            kullanici: 'logo',
            aciklama: "Logo'da miktar " + JP.fmt.miktar(k.logoMiktar) + ' → ' + JP.fmt.miktar(r.miktar)
          });
          if (yazildi) {
            sonuc.miktarDegisimi++;
            log(db, 'logo', 'Miktar değişimi', fis.fisNo + ' · ' + k.urunKod + ' ' + JP.fmt.miktar(k.logoMiktar) + ' → ' + JP.fmt.miktar(r.miktar));
          } else { sonuc.atlanan++; }
          k.logoMiktar = r2(r.miktar);
        });

        // 2) fişe bağlı faturalar — kademe 1
        db.logo.faturalar.filter(function (f) { return f.fisNo === fis.fisNo; }).forEach(function (f) {
          f.satirlar.forEach(function (fr, i) {
            var ref = 'logo:fatura:' + f.no + ':' + i;
            var fisSatir = fis.satirlar.find(function (r) { return r.id === fr.fisSatirId; });
            var k = fisSatir && s.kalemler.find(function (x) { return x.id === fisSatir.portalKalemId; });
            if (!k) return;
            if (db.havuz.some(function (h) { return h.ref === ref; })) { sonuc.atlanan++; return; }
            hareket(db, {
              bayiKod: s.bayiKod, urunKod: k.urunKod, tip: 'dFatura', miktar: fr.miktar,
              kaynak: 'logo', ref: ref, siparisNo: s.no, talepNo: k.talepNo, talepKalemId: k.talepKalemId,
              belge: f.no, eslesme: 'baglantili', kullanici: 'logo',
              aciklama: 'Fatura kesildi (' + f.tur + ')'
            });
            // rezerv aynı işlemde kapatılır
            hareket(db, {
              bayiKod: s.bayiKod, urunKod: k.urunKod, tip: 'dRezerv', miktar: -fr.miktar,
              kaynak: 'logo', ref: ref + ':rez', siparisNo: s.no, talepNo: k.talepNo, talepKalemId: k.talepKalemId,
              belge: f.no, kullanici: 'logo', aciklama: 'Faturalanan miktarın rezervi çözüldü'
            });
            k.faturalanan = r2(k.faturalanan + fr.miktar);
            sonuc.faturaHareketi++;
          });
        });

        // 4) durum
        var tumFaturalandi = s.kalemler.every(function (k) { return k.faturalanan >= k.logoMiktar - 0.001; });
        var faturalar = db.logo.faturalar.filter(function (f) { return f.fisNo === fis.fisNo; });
        var gibTamam = faturalar.length > 0 && faturalar.every(function (f) { return f.gib === 'Başarılı'; });
        if (tumFaturalandi && gibTamam) {
          if (s.durum !== 'Tamamlandı') {
            s.durum = 'Tamamlandı'; sonuc.kapanan++;
            bildir(db, s.bayiKod, 'Siparişiniz tamamlandı', s.no + ' faturalandı ve GİB gönderimi başarılı.');
            log(db, 'logo', 'Sipariş kapanışı', s.no + ' · tüm kalemler faturalandı, GİB gönderimi başarılı → Tamamlandı');
          }
        } else if (faturalar.length) {
          s.durum = 'Faturalandı';
        }
      });

      // 3) fişsiz faturalar — kademe 2 (FIFO) / kademe 3 (eşleşmeyen)
      if (!siparisNo) {
        db.logo.faturalar.filter(function (f) { return !f.fisNo; }).forEach(function (f) {
          f.satirlar.forEach(function (fr, i) {
            var ref = 'logo:fatura:' + f.no + ':' + i;
            if (db.havuz.some(function (h) { return h.ref === ref; })) { sonuc.atlanan++; return; }
            if (db.talepDisi.some(function (t) { return t.ref === ref; })) { sonuc.atlanan++; return; }
            var kalan = fr.miktar;
            var adaylar = acikKalemler(db, f.cariKod, fr.stokKod);
            adaylar.forEach(function (a, j) {
              if (kalan <= 0.001) return;
              var pay = Math.min(kalan, a.acik);
              hareket(db, {
                bayiKod: f.cariKod, urunKod: fr.stokKod, tip: 'dFatura', miktar: pay,
                kaynak: 'logo', ref: ref + (j ? ':p' + j : ''), talepNo: a.talepNo, talepKalemId: a.kalemId,
                belge: f.no, eslesme: 'fifo', kullanici: 'logo',
                aciklama: 'Sipariş bağlantısı yok — en eski açık talebe (FIFO) tahsis edildi'
              });
              kalan = r2(kalan - pay); sonuc.fifo++;
            });
            if (kalan > 0.001) {
              db.talepDisi.push({
                id: uid('td'), ref: ref, ts: now(), faturaNo: f.no, bayiKod: f.cariKod,
                urunKod: fr.stokKod, miktar: kalan, cozuldu: false
              });
              sonuc.eslesmeyen++;
              log(db, 'logo', 'Eşleşmeyen fatura', f.no + ' · ' + fr.stokKod + ' ' + JP.fmt.miktar(kalan) + ' birim talebi aşıyor → Talep Dışı Fatura listesi', true);
            }
          });
        });
      }

      var alan = siparisNo ? 'siparis' : 'fatura';
      db.senkron[alan] = { ts: now(), okunanFis: sonuc.okunanFis, hareket: sonuc.faturaHareketi + sonuc.fifo, atlanan: sonuc.atlanan };
      db.senkron.siparis = db.senkron[alan];
      log(db, 'logo', 'Durum sorgusu', (siparisNo || 'Tüm açık siparişler') + ' · ' + sonuc.okunanFis + ' fiş okundu, ' +
        (sonuc.miktarDegisimi + sonuc.faturaHareketi + sonuc.fifo) + ' hareket yazıldı, ' + sonuc.atlanan + ' mükerrer atlandı');
      return sonuc;
    });
  };

  /** FIFO adayları: bayi + ürün için en eski açık talep kalemleri. */
  function acikKalemler(db, bayiKod, urunKod) {
    var out = [];
    db.talepler.slice().sort(function (a, b) { return a.tarih.localeCompare(b.tarih); }).forEach(function (t) {
      if (t.bayiKod !== bayiKod || t.iptal) return;
      t.kalemler.forEach(function (k) {
        if (k.urunKod !== urunKod) return;
        var b = bakiye(db.havuz.filter(function (h) { return h.talepKalemId === k.id; }));
        var acik = r2(b.talep - b.fatura);          // FIFO fatura tahsisi rezervi tüketmez
        if (acik > 0.001) out.push({ talepNo: t.no, kalemId: k.id, acik: acik, tarih: t.tarih });
      });
    });
    return out;
  }

  /* --------------------------------------------- elle hareket / elle tahsis */
  JP.SEBEPLER = [
    { kod: 'NUMUNE', ad: 'Numune / kartela gönderimi' },
    { kod: 'KONSINYE', ad: 'Konsinye çıkış' },
    { kod: 'GECMIS', ad: 'Geçmiş dönem faturası' },
    { kod: 'DUZELTME', ad: 'Kayıt düzeltmesi' },
    { kod: 'MUTABAKAT', ad: 'Bayi mutabakatı' }
  ];

  JP.elleHareket = function (p) {
    return JP.tx(function (db) {
      if (!p.sebep) throw new Error('Sebep kodu zorunludur.');
      if (!p.miktar) throw new Error('Miktar girin.');
      var h = hareket(db, {
        bayiKod: p.bayiKod, urunKod: p.urunKod, tip: p.tip, miktar: r2(p.miktar),
        kaynak: 'elle', talepKalemId: p.talepKalemId || null, talepNo: p.talepNo || null,
        sebep: p.sebep, eslesme: p.tip === 'dFatura' ? 'elle' : null,
        kullanici: p.kullanici || 'muhasebe', aciklama: p.aciklama || 'Elle hareket'
      });
      log(db, 'portal', 'Elle hareket', p.bayiKod + ' · ' + p.urunKod + ' · ' + p.tip + ' ' + JP.fmt.miktar(p.miktar) + ' (' + p.sebep + ')');
      return h;
    });
  };

  /** Talep dışı faturayı elle bir talep kalemine bağlar. */
  JP.talepDisiBagla = function (kayitId, kalemId, kullanici) {
    return JP.tx(function (db) {
      var td = db.talepDisi.find(function (x) { return x.id === kayitId; });
      if (!td || td.cozuldu) throw new Error('Kayıt bulunamadı.');
      var talep = db.talepler.find(function (t) { return t.kalemler.some(function (k) { return k.id === kalemId; }); });
      hareket(db, {
        bayiKod: td.bayiKod, urunKod: td.urunKod, tip: 'dFatura', miktar: td.miktar,
        kaynak: 'elle', ref: td.ref + ':elle', talepNo: talep ? talep.no : null, talepKalemId: kalemId,
        belge: td.faturaNo, eslesme: 'elle', sebep: 'DUZELTME', kullanici: kullanici || 'muhasebe',
        aciklama: 'Talep dışı fatura elle bağlandı'
      });
      td.cozuldu = true; td.cozumTs = now();
      log(db, 'portal', 'Talep dışı fatura', td.faturaNo + ' · ' + td.urunKod + ' elle talebe bağlandı');
    });
  };

  /* ============================ LOGO SİMÜLATÖRÜ ============================ */
  JP.logo = {
    fisMiktarDegistir: function (fisNo, satirId, yeni) {
      return JP.tx(function (db) {
        var f = db.logo.fisler.find(function (x) { return x.fisNo === fisNo; });
        var r = f && f.satirlar.find(function (x) { return x.id === satirId; });
        if (!r) throw new Error('Fiş satırı bulunamadı.');
        yeni = r2(Math.max(0, yeni));
        if (yeni === r.miktar) return;
        var faturalanmis = faturalananMiktar(db, fisNo, satirId);
        if (yeni < faturalanmis) throw new Error('Bu satırın ' + JP.fmt.miktar(faturalanmis) + ' birimi faturalanmış; altına inilemez.');
        r.miktar = yeni; r.surum++;
        log(db, 'logo', 'Logo · fiş güncellendi', fisNo + ' / ' + satirId + ' miktar → ' + JP.fmt.miktar(yeni));
      });
    },

    fisIptal: function (fisNo) {
      return JP.tx(function (db) {
        var f = db.logo.fisler.find(function (x) { return x.fisNo === fisNo; });
        if (!f) throw new Error('Fiş bulunamadı.');
        if (db.logo.faturalar.some(function (x) { return x.fisNo === fisNo; })) throw new Error('Faturası kesilmiş fiş iptal edilemez.');
        f.iptal = true; f.durum = 'İptal';
        log(db, 'logo', 'Logo · fiş iptali', fisNo + ' iptal edildi');
      });
    },

    faturaKes: function (fisNo, satirlar, tur) {
      return JP.tx(function (db) {
        var f = db.logo.fisler.find(function (x) { return x.fisNo === fisNo; });
        if (!f) throw new Error('Fiş bulunamadı.');
        var temiz = satirlar.filter(function (s) { return s.miktar > 0; });
        if (!temiz.length) throw new Error('Faturalanacak miktar girin.');
        temiz.forEach(function (s) {
          var r = f.satirlar.find(function (x) { return x.id === s.fisSatirId; });
          var kalan = r2(r.miktar - faturalananMiktar(db, fisNo, s.fisSatirId));
          if (s.miktar > kalan + 0.001) throw new Error(r.stokKod + ' için faturalanabilir kalan ' + JP.fmt.miktar(kalan) + ' birim.');
        });
        var fatura = yeniFatura(db, f.cariKod, tur || 'e-Fatura', fisNo);
        fatura.satirlar = temiz.map(function (s) {
          var r = f.satirlar.find(function (x) { return x.id === s.fisSatirId; });
          return { fisSatirId: s.fisSatirId, stokKod: r.stokKod, miktar: r2(s.miktar) };
        });
        db.logo.faturalar.unshift(fatura);
        log(db, 'logo', 'Logo · fatura kesildi', fatura.no + ' (' + fatura.tur + ') · fiş ' + fisNo + ' · ' + fatura.satirlar.length + ' satır');
        return fatura;
      });
    },

    serbestFaturaKes: function (cariKod, satirlar, tur) {
      return JP.tx(function (db) {
        var temiz = satirlar.filter(function (s) { return s.miktar > 0; });
        if (!temiz.length) throw new Error('Faturalanacak miktar girin.');
        var fatura = yeniFatura(db, cariKod, tur || 'e-Arşiv', null);
        fatura.satirlar = temiz.map(function (s) { return { fisSatirId: null, stokKod: s.stokKod, miktar: r2(s.miktar) }; });
        db.logo.faturalar.unshift(fatura);
        log(db, 'logo', 'Logo · serbest fatura', fatura.no + ' · sipariş bağlantısı yok (' + cariKod + ')');
        return fatura;
      });
    },

    gibGonder: function (faturaNo, basarili) {
      return JP.tx(function (db) {
        var f = db.logo.faturalar.find(function (x) { return x.no === faturaNo; });
        if (!f) throw new Error('Fatura bulunamadı.');
        f.gib = basarili === false ? 'Hata' : 'Başarılı';
        f.gibTs = now();
        f.ettn = f.ettn || uid('') + '-' + uid('') + '-jal';
        log(db, 'logo', 'Logo · GİB gönderimi', f.no + ' · ' + f.gib + (f.gib === 'Başarılı' ? ' · ETTN ' + f.ettn : ''), f.gib === 'Hata');
      });
    },

    stokDurum: function (kod, aktif) {
      return JP.tx(function (db) {
        var s = db.logo.stok.find(function (x) { return x.kod === kod; });
        if (s) { s.aktif = aktif; log(db, 'logo', 'Logo · stok kartı', kod + ' → ' + (aktif ? 'aktif' : 'pasif')); }
      });
    },

    stokEkle: function (kod, ad, grup, birim, renk, doku) {
      return JP.tx(function (db) {
        if (db.logo.stok.some(function (s) { return s.kod === kod; })) throw new Error('Bu stok kodu zaten var.');
        db.logo.stok.push({ kod: kod, ad: ad, grup: grup, birim: birim, renk: renk || '#B9AE99', doku: doku || 'diger', aktif: true, sira: db.logo.stok.length });
        log(db, 'logo', 'Logo · stok kartı', kod + ' oluşturuldu');
      });
    },

    cariDurum: function (kod, aktif) {
      return JP.tx(function (db) {
        var c = db.logo.cari.find(function (x) { return x.kod === kod; });
        if (c) { c.aktif = aktif; log(db, 'logo', 'Logo · cari kartı', kod + ' → ' + (aktif ? 'aktif' : 'pasif')); }
      });
    }
  };

  function yeniFatura(db, cariKod, tur, fisNo) {
    db.sayac.fatura++;
    return {
      no: 'JAL' + yil() + pad(db.sayac.fatura, 9),
      tur: tur, fisNo: fisNo, cariKod: cariKod, tarih: now(),
      gib: 'Kesilmedi', gibTs: null, ettn: null, satirlar: []
    };
  }

  function faturalananMiktar(db, fisNo, satirId) {
    return r2(db.logo.faturalar.filter(function (f) { return f.fisNo === fisNo; })
      .reduce(function (t, f) {
        return t + f.satirlar.reduce(function (u, s) { return s.fisSatirId === satirId ? u + s.miktar : u; }, 0);
      }, 0));
  }
  JP.logoFaturalanan = faturalananMiktar;

  /* --------------------------------------------------------------- raporlar */
  JP.raporAcikTalep = function (filtre) {
    filtre = filtre || {};
    var db = JP.db;
    return JP.havuzOzet(filtre).map(function (r) {
      var b = db.bayiler.find(function (x) { return x.kod === r.bayiKod; }) || { unvan: r.bayiKod };
      var u = db.urunler.find(function (x) { return x.kod === r.urunKod; }) || { ad: r.urunKod, grup: '—', birim: '' };
      return Object.assign({}, r, { bayiUnvan: b.unvan, urunAd: u.ad, grup: u.grup, birim: u.birim });
    }).filter(function (r) { return !filtre.grup || r.grup === filtre.grup; });
  };

  JP.raporEslesme = function () {
    var say = { baglantili: 0, fifo: 0, elle: 0 }, miktar = { baglantili: 0, fifo: 0, elle: 0 };
    JP.db.havuz.forEach(function (h) {
      if (h.tip !== 'dFatura' || !h.eslesme) return;
      say[h.eslesme]++; miktar[h.eslesme] = r2(miktar[h.eslesme] + h.miktar);
    });
    var toplam = say.baglantili + say.fifo + say.elle;
    return { say: say, miktar: miktar, toplam: toplam, eslesmeyen: JP.db.talepDisi.filter(function (t) { return !t.cozuldu; }).length };
  };

  /* ------------------------------------------------------------------ tohum */
  function tohum(bos) {
    var db = bosDb();
    mem = db;
    if (bos) return db;                      // "Demoyu baştan başlat": portal tarafı boş

    // --- ana veriyi Logo'dan çekilmiş varsay
    db.logo.stok.forEach(function (s) {
      db.urunler.push({
        kod: s.kod, ad: s.ad, grup: s.grup, birim: s.birim, renk: s.renk, doku: s.doku,
        logoAktif: s.aktif, logodaYok: false, siparieAcik: s.aktif,
        aciklama: aciklamaOf(s.grup), gosterimBirimi: s.birim === 'MTR' ? 'metre' : 'adet', sira: s.sira
      });
    });
    db.logo.cari.forEach(function (c) {
      db.bayiler.push({
        kod: c.kod, unvan: c.unvan, sehir: c.sehir, ulke: c.ulke, eposta: c.eposta,
        logoAktif: c.aktif, logodaYok: false, siparisAcik: c.aktif,
        kisit: { tip: 'tumu', gruplar: [], urunler: [] }, teslimatNotu: ''
      });
    });
    db.senkron.urun = { ts: gecmis(2), yeni: db.logo.stok.length, guncel: 0, pasif: 0, toplam: db.logo.stok.length };
    db.senkron.cari = { ts: gecmis(2), yeni: db.logo.cari.length, guncel: 0, pasif: 0, toplam: db.logo.cari.length };

    // yurt dışı bayi yalnızca iki gruba açık — kısıt davranışı görünsün
    var balkan = db.bayiler.find(function (b) { return b.kod === 'BYI-0004'; });
    balkan.kisit = { tip: 'gruplar', gruplar: ['Zebra', 'Sun Screen'], urunler: [] };
    db.urunler.find(function (u) { return u.kod === 'ZEB-1200-KARTELA'; }).siparieAcik = false;

    // --- geçmiş hareket: yaşlanmış açık talep + akışı tamamlanmış bir sipariş
    _ts = gecmis(24);
    JP.talepOlustur('BYI-0001', [
      { urunKod: 'ZEB-1200-KREM', miktar: 320 },
      { urunKod: 'STR-3000-BEYAZ', miktar: 150 },
      { urunKod: 'TUL-0500-EKRU', miktar: 90 }
    ], 'Sezon açılışı için ilk parti. Kartela ile aynı tonlar olsun.', null);

    _ts = gecmis(21);
    var t1 = db.talepler[0];
    JP.siparisOlustur('BYI-0001', [
      { talepNo: t1.no, kalemId: t1.kalemler[0].id, miktar: 200 },
      { talepNo: t1.no, kalemId: t1.kalemler[1].id, miktar: 150 }
    ], 'muhasebe');
    JP.siparisLogoyaGonder(db.siparisler[0].no);

    _ts = gecmis(18);
    var fis1 = db.logo.fisler[0];
    JP.logo.faturaKes(fis1.fisNo, fis1.satirlar.map(function (r) { return { fisSatirId: r.id, miktar: r.miktar }; }), 'e-Fatura');
    JP.logo.gibGonder(db.logo.faturalar[0].no, true);
    JP.durumSorgula();

    _ts = gecmis(9);
    JP.talepOlustur('BYI-0002', [
      { urunKod: 'SSC-0310-GUMUS', miktar: 240 },
      { urunKod: 'ZEB-1200-ANTR', miktar: 180 }
    ], 'Ofis projesi — teslim tarihi kritik.', null);

    _ts = gecmis(3);
    JP.talepOlustur('BYI-0004', [
      { urunKod: 'ZEB-2400-BEJ', miktar: 400 },
      { urunKod: 'SSC-0510-BEYAZ', miktar: 120 }
    ], 'Belgrad deposu için. Konteyner yüklemesi ayın 25\'i.', null);

    // Logo'ya iletilmiş, henüz faturalanmamış bir sipariş — canlı demoda kaldığı yerden devam eder
    _ts = gecmis(2);
    var t2 = db.talepler.find(function (t) { return t.bayiKod === 'BYI-0002'; });
    JP.siparisOlustur('BYI-0002', [
      { talepNo: t2.no, kalemId: t2.kalemler[0].id, miktar: 150 }
    ], 'muhasebe');
    JP.siparisLogoyaGonder(db.siparisler[0].no);

    _ts = null;
    db.meta.rev = 0;
    return db;
  }

  function aciklamaOf(grup) {
    var m = {
      'Zebra': 'Çift kat gündüz/gece dokuma. 200 cm ve 280 cm en. Işık geçirgenliği ayarlanabilir.',
      'Stor': 'Tek kat düz dokuma stor kumaşı. Leke tutmaz apre, 280 cm en.',
      'Tül Stor': 'Şeffaf tül dokuma. Gün ışığını yumuşatır, 300 cm en.',
      'Sun Screen': 'PVC kaplı cam elyaf. Isı ve UV kontrolü, açıklık oranı etikette.',
      'Plise': 'Katlanabilir plise dokuma. Cam üstü montaj için 45 mm katlama.',
      'Sineklik': 'Fiberglas sineklik tülü. 18×16 göz, 180 cm en.'
    };
    return m[grup] || '';
  }

  JP.aciklamaOf = aciklamaOf;
})();

/* Jalpersan B2B PoC — ortak arayüz yardımcıları (kabuk, tablo, kip, bildirim) */
(function () {
  'use strict';
  var JP = window.JP;
  var UI = (JP.UI = {});

  /* ---------------------------------------------------------------- eleman */
  function h(tag, props, cocuk) {
    var parca = tag.split(/([.#])/), el = document.createElement(parca[0] || 'div');
    for (var i = 1; i < parca.length; i += 2) {
      if (parca[i] === '.') el.classList.add(parca[i + 1]); else el.id = parca[i + 1];
    }
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = !!v;
      else el.setAttribute(k, v);
    });
    ekle(el, cocuk);
    return el;
  }
  function ekle(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) return c.forEach(function (x) { ekle(el, x); });
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  UI.h = h;

  /* -------------------------------------------------------------- bildirim */
  var kutu = null;
  UI.toast = function (baslik, metin, tip) {
    if (!kutu) { kutu = h('div.toasts'); document.body.appendChild(kutu); }
    var t = h('div.toast' + (tip ? '.' + tip : ''), {}, [h('b', { text: baslik }), metin ? h('span', { text: metin }) : null]);
    kutu.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { t.remove(); }, 320); }, 4200);
  };
  UI.hata = function (e) { UI.toast('İşlem yapılamadı', e && e.message ? e.message : String(e), 'bad'); };
  UI.dene = function (fn) { try { fn(); } catch (e) { UI.hata(e); } };

  /* ------------------------------------------------------------------- kip */
  UI.modal = function (o) {
    var arka = h('div.modal-bg', {
      onclick: function (e) { if (e.target === arka) kapat(); }
    });
    function kapat() { arka.remove(); document.removeEventListener('keydown', esc); }
    function esc(e) { if (e.key === 'Escape') kapat(); }
    document.addEventListener('keydown', esc);

    var kip = h('div.modal' + (o.genis ? '.wide' : ''), { role: 'dialog', 'aria-modal': 'true' }, [
      h('header', {}, [
        h('h2', { text: o.baslik }),
        o.etiket ? h('span.tag', { text: o.etiket }) : null,
        h('div.spacer'),
        h('button.btn.ghost.sm', { text: 'Kapat', onclick: kapat })
      ]),
      h('div.mb', {}, o.icerik),
      o.aksiyonlar ? h('footer', {}, o.aksiyonlar(kapat)) : null
    ]);
    arka.appendChild(kip);
    document.body.appendChild(arka);
    var ilk = kip.querySelector('input, select, textarea, button.primary');
    if (ilk) ilk.focus();
    return { kapat: kapat, el: kip };
  };

  UI.onay = function (baslik, metin, fn, tehlike) {
    UI.modal({
      baslik: baslik,
      icerik: h('p', { text: metin }),
      aksiyonlar: function (kapat) {
        return [
          h('button.btn', { text: 'Vazgeç', onclick: kapat }),
          h('button.btn.primary' + (tehlike ? '.danger' : ''), {
            text: 'Onayla', onclick: function () { kapat(); UI.dene(fn); }
          })
        ];
      }
    });
  };

  /* ----------------------------------------------------------- veri dışa akt. */
  UI.tabloKopyala = function (baslik, satirlar) {
    var tsv = satirlar.map(function (r) { return r.join('\t'); }).join('\n');
    function fallback() {
      UI.modal({
        baslik: baslik, etiket: 'Excel için seçip kopyalayın',
        icerik: h('textarea', { value: tsv, rows: 16, readonly: 'readonly', style: { fontFamily: 'var(--font-mono)', fontSize: '11px' } })
      });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tsv).then(
        function () { UI.toast('Panoya kopyalandı', (satirlar.length - 1) + ' satır — Excel\'e doğrudan yapıştırabilirsiniz.', 'ok'); },
        fallback
      );
    } else { fallback(); }
  };

  /* ---------------------------------------------------------------- rozet */
  var RENK = {
    'Açık': 'warn', 'Kısmen Karşılandı': 'info', 'Karşılandı': 'acc', 'Tamamlandı': 'ok', 'İptal': '',
    'Taslak': '', "Logo'ya İletildi": 'info', 'Gönderim Hatası': 'bad', 'Faturalandı': 'acc',
    'Kesilmedi': 'warn', 'Başarılı': 'ok', 'Hata': 'bad', 'Gönderildi': 'info'
  };
  UI.rozet = function (metin, tip) {
    return h('span.badge' + (RENK[metin] || tip ? '.' + (tip || RENK[metin]) : ''), { text: metin });
  };

  /* ------------------------------------------------------------ bakiye bandı */
  UI.bant = function (b) {
    var t = Math.max(b.talep, b.rezerv + b.fatura, 0.0001);
    return h('div.bar', { title: 'Faturalanan ' + JP.fmt.miktar(b.fatura) + ' · Siparişte ' + JP.fmt.miktar(b.rezerv) + ' · Açık ' + JP.fmt.miktar(b.acik) }, [
      h('i.b-fat', { style: { width: (b.fatura / t * 100) + '%' } }),
      h('i.b-rez', { style: { width: (b.rezerv / t * 100) + '%' } }),
      h('i.b-acik', { style: { width: (Math.max(0, b.acik) / t * 100) + '%' } })
    ]);
  };
  UI.bantAciklama = function () {
    return h('div.legend', {}, [
      h('span', { html: '<i style="background:var(--ok)"></i>Faturalanan' }),
      h('span', { html: '<i style="background:var(--info)"></i>Siparişte (rezerve)' }),
      h('span', { html: '<i style="background:var(--warn)"></i>Açık talep' })
    ]);
  };

  /* ------------------------------------------------------------- kumaş kartı */
  UI.kartela = function (urun, yukseklik) {
    return h('div.swatch.sw-' + (urun.doku || 'diger'), {
      style: { '--sw': urun.renk || '#B9AE99', aspectRatio: yukseklik ? 'auto' : '3 / 2', height: yukseklik || 'auto' },
      'aria-hidden': 'true'
    });
  };

  /* ------------------------------------------------------------------ tablo */
  UI.tablo = function (basliklar, satirlar, bosMetin) {
    if (!satirlar.length) return h('div.empty', { text: bosMetin || 'Kayıt yok.' });
    return h('div.tbl-wrap', {}, h('table.tbl', {}, [
      h('thead', {}, h('tr', {}, basliklar.map(function (b) {
        return h('th' + (b && b.num ? '.num' : ''), { text: b && b.t !== undefined ? b.t : b });
      }))),
      h('tbody', {}, satirlar)
    ]));
  };

  /* ------------------------------------------------------------------ kabuk */
  UI.kabuk = function (o) {
    document.title = o.baslik + ' · Jalpersan B2B';
    document.documentElement.classList.toggle('logo-world', !!o.karanlik);
    if (JP.aboneSifirla) JP.aboneSifirla();

    var kok = document.getElementById('app');
    var railEl = h('nav.rail', { 'aria-label': 'Bölümler' });
    var anaEl = h('main.main');
    var aktif = sessionStorage.getItem('jp.bolum.' + o.rol) || o.bolumler[0].id;
    if (!o.bolumler.some(function (b) { return b.id === aktif; })) aktif = o.bolumler[0].id;

    function railCiz() {
      railEl.textContent = '';
      railEl.appendChild(h('div.eyebrow', { text: o.railBaslik || 'Bölümler' }));
      o.bolumler.forEach(function (b) {
        var n = b.sayi ? b.sayi() : null;
        railEl.appendChild(h('button', {
          'aria-current': String(b.id === aktif),
          onclick: function () { aktif = b.id; sessionStorage.setItem('jp.bolum.' + o.rol, b.id); ciz(); }
        }, [h('span', { text: b.ad }), n ? h('span.count' + (b.sicak && b.sicak() ? '.hot' : ''), { text: n }) : null]));
      });
    }

    function ciz() {
      railCiz();
      anaEl.textContent = '';
      var b = o.bolumler.find(function (x) { return x.id === aktif; });
      anaEl.appendChild(h('header', {}, [
        h('h1', { text: b.baslik || b.ad }),
        b.aciklama ? h('p', { text: b.aciklama }) : null
      ]));
      try { anaEl.appendChild(b.ciz()); }
      catch (e) { console.error(e); anaEl.appendChild(h('div.note.bad', { text: 'Ekran çizilemedi: ' + e.message })); }
    }

    kok.textContent = '';
    kok.appendChild(h('div.app', {}, [
      h('header.topbar', {}, [
        h('div.brand', {}, [h('b', { text: 'Jalpersan' }), h('span', { text: o.altBaslik })]),
        h('span.role-chip', {}, [h('span.dot'), o.rolAdi]),
        JP.rolSecici ? JP.rolSecici() : null,
        h('div.spacer'),
        o.ustSag ? o.ustSag() : null,
        h('span.poc-flag', { text: 'Prototip · demo verisi', title: JP.SURUM })
      ]),
      JP.depoEngeli ? h('div.note.warn', { style: { margin: '10px 14px 0' }, html: '<b>Tarayıcı depolaması kapalı.</b> Ekranlar arası paylaşım çalışmaz; sayfayı normal bir sekmede (veya yayındaki adreste) açın.' }) : null,
      h('div.shell', {}, [railEl, anaEl])
    ]));

    ciz();
    JP.abone(function () { ciz(); });
    return { ciz: ciz };
  };

  /* ------------------------------------------------ küçük bileşen kısayolları */
  UI.kpi = function (etiket, deger, birim, alt, vurgu) {
    return h('div.kpi' + (vurgu ? '.on-accent' : ''), {}, [
      h('div.k', { text: etiket }),
      h('div.v', {}, [String(deger), birim ? h('span.u', { text: birim }) : null]),
      alt ? h('div.s', { text: alt }) : null
    ]);
  };

  UI.panel = function (baslik, aksiyonlar, govde, duz) {
    return h('div.panel', {}, [
      baslik ? h('div.panel-head', {}, [h('h2', { text: baslik }), h('div.spacer'), aksiyonlar]) : null,
      h('div.panel-body' + (duz ? '.flush' : ''), {}, govde)
    ]);
  };

  UI.senkronBilgi = function (s) {
    if (!s) return h('span.small.muted', { text: 'Hiç çalıştırılmadı' });
    return h('span.small.muted', { text: 'Son: ' + JP.fmt.saat(s.ts) + (s.toplam ? ' · ' + s.toplam + ' kayıt' : '') });
  };
})();

/* Bayi portalı — katalog, satın alma talebi, kendi havuz dökümü.
   Bayi fiyat ve stok görmez (teknik doküman 1.1). */
(function () {
  'use strict';
  var JP = window.JP, UI = JP.UI, h = UI.h;

  function aktifBayi() {
    var db = JP.db;
    var kod = sessionStorage.getItem('jp.bayi');
    if (!kod || !db.bayiler.some(function (b) { return b.kod === kod; })) {
      kod = (db.bayiler[0] || {}).kod || null;
      if (kod) sessionStorage.setItem('jp.bayi', kod);
    }
    return db.bayiler.find(function (b) { return b.kod === kod; }) || null;
  }

  var sepet = {};          // urunKod -> miktar

  JP.bayiEkran = function () {
    UI.kabuk({
      rol: 'bayi', rolAdi: 'Bayi portalı', baslik: 'Bayi portalı', altBaslik: 'B2B satın alma talebi',
      railBaslik: 'Bayi',
      ustSag: bayiSecici,
      bolumler: [
        { id: 'katalog', ad: 'Ürün kataloğu', baslik: 'Ürün kataloğu',
          aciklama: 'Yetkili olduğunuz ürünlerden miktar girip satın alma talebi gönderin. Fiyat ve stok bilgisi gösterilmez.',
          ciz: katalog, sayi: function () { var b = aktifBayi(); return b ? JP.bayiUrunleri(b.kod).length : 0; } },
        { id: 'talepler', ad: 'Taleplerim', baslik: 'Satın alma taleplerim',
          aciklama: 'Her kalemin talep, siparişe dönen, faturalanan ve kalan miktarını görürsünüz.',
          ciz: talepler, sayi: function () { var b = aktifBayi(); return b ? JP.db.talepler.filter(function (t) { return t.bayiKod === b.kod; }).length : 0; } },
        { id: 'havuz', ad: 'Talep havuzum', baslik: 'Talep havuzu',
          aciklama: 'Ürün bazında dört bakiye ve hareket dökümü. Bakiye saklanmaz, hareketlerden hesaplanır.',
          ciz: havuz },
        { id: 'bildirim', ad: 'Bildirimler', baslik: 'Bildirimler',
          aciklama: 'Sipariş ve fatura kapanışlarında portalın gönderdiği bilgilendirmeler.', ciz: bildirimler }
      ]
    });
  };

  function bayiSecici() {
    var db = JP.db, b = aktifBayi();
    if (!db.bayiler.length) return h('span.small.muted', { text: 'Bayi listesi henüz Logo\'dan alınmadı' });
    return h('label.row.tight', {}, [
      h('span.small.muted', { text: 'Oturum:' }),
      h('select', {
        style: { width: 'auto', minWidth: '210px' },
        onchange: function (e) { sessionStorage.setItem('jp.bayi', e.target.value); sepet = {}; location.reload(); }
      }, db.bayiler.map(function (x) {
        return h('option', { value: x.kod, selected: b && x.kod === b.kod, text: x.unvan + (x.siparisAcik ? '' : ' — siparişe kapalı') });
      }))
    ]);
  }

  /* ------------------------------------------------------------- katalog */
  function katalog() {
    var db = JP.db, bayi = aktifBayi();
    if (!bayi) return h('div.note.warn', { html: '<b>Bayi kartı yok.</b> Firma panelinden “Bayileri Logo\'dan al” işlemini çalıştırın.' });

    var urunler = JP.bayiUrunleri(bayi.kod);
    var kap = h('div.stack');

    if (!bayi.siparisAcik) {
      kap.appendChild(h('div.note.warn', { html: '<b>Hesabınız siparişe kapalı.</b> Talepleri görüntüleyebilirsiniz, yeni talep oluşturulamaz.' }));
    }
    if (bayi.kisit.tip !== 'tumu') {
      kap.appendChild(h('div.note', {
        html: '<b>Sınırlı katalog.</b> Firma tarafından yalnızca ' +
          (bayi.kisit.tip === 'gruplar' ? bayi.kisit.gruplar.join(', ') + ' grupları' : bayi.kisit.urunler.length + ' ürün') + ' açılmış.'
      }));
    }
    if (!urunler.length) {
      kap.appendChild(h('div.empty', { text: 'Bu bayiye açık ürün bulunmuyor.' }));
      return kap;
    }

    // grup grup katalog
    var gruplar = [];
    urunler.forEach(function (u) { if (gruplar.indexOf(u.grup) < 0) gruplar.push(u.grup); });

    var ozetEl = h('div');
    function ozetCiz() {
      var kalemler = Object.keys(sepet).filter(function (k) { return sepet[k] > 0; });

        h('div.stack', {}, [

      });
      return h('div.prod', {}, [

        h('div.pb', {}, [
          h('div', {}, [h('div.pn', { text: u.ad }), h('div.pc', { text: u.kod })]),

  function talepler() {
    var db = JP.db, bayi = aktifBayi();

  function azaltKip(t, k) {
    var taban = k.rezerv + k.fatura;

        h('p', { text: k.urun.ad + ' (' + k.kalem.urunKod + ')' }),

  function hareketKip(talepNo) {
    var hs = JP.db.havuz.filter(function (x) { return x.talepNo === talepNo; })
      .sort(function (a, b) { return b.ts.localeCompare(a.ts); });

  function hareketTablosu(hs) {

  /* ----------------------------------------------------------------- havuz */
  function havuz() {

    if (!bayi) return h('div.empty', { text: 'Bayi seçilmedi.' });
    var satirlar = JP.havuzOzet({ bayiKod: bayi.kod });

    var hs = JP.db.havuz.filter(function (x) { return x.bayiKod === bayi.kod; })

    return h('div.stack', {}, [
      h('div.grid.k4', {}, [

        UI.kpi('Siparişte', JP.fmt.miktar(top.rezerv)),
        UI.kpi('Faturalanan', JP.fmt.miktar(top.fatura)),
        UI.kpi('Açık', JP.fmt.miktar(top.acik), null, 'Siparişe dönmeyi bekleyen', true)
      ]),
      UI.panel('Ürün bazında bakiye', UI.bantAciklama(),
        UI.tablo(['Ürün', { t: 'Talep', num: true }, { t: 'Siparişte', num: true }, { t: 'Faturalanan', num: true }, { t: 'Açık', num: true }, 'Dağılım', { t: 'Yaş', num: true }],

            return h('tr', {}, [
              h('td', {}, [h('div', { text: u.ad }), h('div.pc.mono', { text: r.urunKod })]),
              h('td.num.mono', { text: JP.fmt.miktar(r.talep) }),
              h('td.num.mono', { text: JP.fmt.miktar(r.rezerv) }),
              h('td.num.mono', { text: JP.fmt.miktar(r.fatura) }),
              h('td.num.mono', { text: JP.fmt.miktar(r.acik) }),
              h('td', { style: { width: '150px' } }, UI.bant(r)),
              h('td.num.small.muted', { text: r.yas + ' g' })
            ]);
          }), 'Havuzda hareket yok.'), true),
      UI.panel('Hareket dökümü', h('span.small.muted', { text: hs.length + ' hareket' }), hareketTablosu(hs), true)
    ]);
  }

  function bildirimler() {
    var bayi = aktifBayi();
    var liste = JP.db.bildirim.filter(function (b) { return b.kime === (bayi && bayi.kod); });
    if (!liste.length) return h('div.empty', { text: 'Bildirim yok.' });
    return h('div.stack', {}, liste.map(function (b) {
      return h('div.note', {}, [h('b', { text: b.baslik }), h('div', { text: b.metin }), h('div.small.muted', { text: JP.fmt.saat(b.ts) })]);
    }));
  }
})();

    });
